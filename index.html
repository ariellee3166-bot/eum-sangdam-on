      </${A4}>
    </div>
  </div>`;
}


/* ───────── 상담 후 결과 기록지 ───────── */
function AfterView({ctx}) {
  const {cur: rec, setField, updateRecord, say} = ctx;
  if (!rec) return html`<${NeedChild} ctx=${ctx} what="결과 기록지"/>`;
  const A = rec.after, b = rec.basic;
  const tp = {tight: !!rec.ai.tight.after, onTight: v => setField(rec.id, ['ai', 'tight', 'after'], v)};
  const f = (k, v) => setField(rec.id, ['after', k], v);
  const qs = rec.questions.filter(q => has(q.q));
  const setQa = (id, v) => setField(rec.id, ['after', 'qa', id], v);
  const ok = rec.ai.approved.after;
  const setOk = v => updateRecord(rec.id, r => ({...r, status: (v && r.status !== 'counseled') ? 'counseled' : r.status, ai: {...r.ai, approved: {...r.ai.approved, after: v}}}));
  const planned = [b.date, b.time, b.method].some(has);
  const eduPlanned = rec.ai.result && rec.ai.result.edu && has(rec.ai.result.edu.title) ? rec.ai.result.edu.title : '';
  const cell = (v, cls = '') => has(v) ? html`<div className=${'g-p ' + cls} style=${{whiteSpace:'pre-wrap'}}>${v}</div>` : html`<div className="blank g-ph">${" "}</div>`;
  const row = (label, body, min) => html`<div className="af-row" style=${{minHeight: min || 'auto'}}><div className="af-l">${label}</div><div className="af-v">${body}</div></div>`;
  const qaDone = qs.filter(q => has(A.qa[q.id]));
  const dt = A.date ? `${fmtDate(A.date)}${A.time ? ' ' + A.time : ''}` : '';
  return html`<div className="printroot">
    <div className="pagehead"><div className="grow"><h2>상담 후 결과 기록지 · ${displayName(rec)}</h2><p>실제 상담을 마친 뒤 작성합니다. 상담 전에 준비한 내용은 자동으로 기록되지 않아요.</p></div></div>
    <div className="notice apricot noprint" style=${{marginBottom:'14px'}}><${Icon} n="info"/><div>이 기록지는 <b>실제로 나눈 이야기</b>만 적습니다. 준비해 둔 답변이나 시나리오는 칸에 미리 채워지지 않고, 아래 버튼을 눌렀을 때 일정과 제목만 가져옵니다.</div></div>
    <div className="card stack noprint" style=${{marginBottom:'16px'}}>
      <div className="row"><h3 style=${{margin:0}}>상담 기록 입력</h3>
        ${planned && html`<button className="btn sm soft" style=${{marginLeft:'auto'}} onClick=${() => updateRecord(rec.id, r => ({...r, after: {...r.after, date: r.after.date || r.basic.date, time: r.after.time || r.basic.time, method: r.after.method || r.basic.method}}))}>예정 일정 가져오기</button>`}</div>
      <div className="grid3">
        <${Field} id="af-date" type="date" label="상담 일자" value=${A.date} onChange=${v => f('date', v)}/>
        <${Field} id="af-time" type="time" label="상담 시간" value=${A.time} onChange=${v => f('time', v)}/>
        <div className="field"><span className="lbl">상담 방법</span><div className="choice">${['전화', '방문'].map(m => html`<label key=${m}><input type="radio" name="af-method" checked=${A.method === m} onChange=${() => f('method', m)}/>${m}</label>`)}</div></div>
      </div>
      <${Field} id="af-content" label="실제 상담 내용" value=${A.content} onChange=${v => f('content', v)} rows=${3}/>
      ${qs.length > 0 && html`<div className="field"><span className="lbl">부모님 질문 및 실제로 전한 답변</span><p className="hint">질문은 STEP 7에서 가져왔어요. 상담에서 실제로 나눈 답변만 적어 주세요. 비워 두면 기록지에 "논의 내용 미기록"으로 표시됩니다.</p>
        <div className="stack" style=${{gap:'10px'}}>${qs.map((q, i) => html`<div key=${q.id} className="qcard"><b className="small">Q${i + 1}. ${q.q}</b><textarea id=${'af-qa-' + q.id} rows="2" aria-label=${'질문 ' + (i + 1) + ' 실제 답변'} value=${A.qa[q.id] || ''} placeholder="실제로 전달한 답변" onChange=${e => setQa(q.id, e.target.value)}></textarea></div>`)}</div></div>`}
      <div className="grid2">
        <${Field} id="af-opinion" label="부모님 의견" value=${A.opinion} onChange=${v => f('opinion', v)} rows=${3}/>
        <${Field} id="af-guided" label="교사가 안내한 내용" value=${A.guided} onChange=${v => f('guided', v)} rows=${3}/>
        <${Field} id="af-concern" label="양육 고민에 대해 함께 논의한 사항" value=${A.concern} onChange=${v => f('concern', v)} rows=${3}/>
        <${Field} id="af-support" label="가정과 협의한 지원 방법" value=${A.support} onChange=${v => f('support', v)} rows=${3}/>
      </div>
      <div className="field"><span className="lbl">실제 제공한 부모교육자료</span>
        <div className="choice"><label><input type="radio" name="af-edu" checked=${A.eduProvided === 'yes'} onChange=${() => f('eduProvided', 'yes')}/>제공함</label><label><input type="radio" name="af-edu" checked=${A.eduProvided === 'no'} onChange=${() => f('eduProvided', 'no')}/>제공하지 않음</label></div>
        ${A.eduProvided === 'yes' && html`<div className="row" style=${{flexWrap:'nowrap'}}><input type="text" id="af-edu-title" placeholder="제공한 자료 제목" value=${A.eduTitle} onChange=${e => f('eduTitle', e.target.value)}/>${eduPlanned && !has(A.eduTitle) && html`<button className="btn sm" onClick=${() => f('eduTitle', eduPlanned)}>예정 제목 넣기</button>`}</div>`}</div>
      <${Field} id="af-follow" label="추후 관찰 및 점검 사항" value=${A.followup} onChange=${v => f('followup', v)} rows=${3}/>
      <div className="grid2"><${Field} id="af-teacher" type="text" label="상담 교사 확인(이름)" value=${A.teacherName} onChange=${v => f('teacherName', v)} placeholder=${b.teacher || '교사 이름'}/>
        <div className="field"><span className="lbl">작성 확인</span><label className="row" style=${{gap:'8px',cursor:'pointer'}}><input type="checkbox" id="ok-after" checked=${ok} onChange=${e => setOk(e.target.checked)} style=${{accentColor:'var(--sage-deep)',width:'18px',height:'18px'}}/>실제 상담 내용을 확인했어요 <span className="muted small">(체크하면 진행 상태가 "상담 완료"로 바뀌어요)</span></label></div></div>
      <div className="row"><button className="btn primary" disabled=${!ok} onClick=${() => printDoc('all', say)}><${Icon} n="print"/>결과 기록지 인쇄·PDF 저장</button>${inIframe && html`<span className="muted small">미리보기 창에서는 인쇄가 막혀 있어요. Chrome·Edge에서 HTML 파일을 직접 열어 주세요.</span>`}</div>
    </div>
    <div className="docs">
      <${A4} label="상담 후 결과 기록지 · A4 1페이지" cls="guide after" ...${tp}>
        <div className="g-banner"><${Icon} n="note" size=${14}/>상담 후 작성 · 기관 내부 기록 · ${termLabel(b.year, b.semester)}</div>
        <h2 className="g-title">상담 후 결과 기록지</h2>
        <div className="af-grid">
          ${row('영유아', cell(displayName(rec)))}${row('반 · 담당 교사', cell([b.className, b.teacher].filter(Boolean).join(' · ')))}
          ${row('상담 일시', cell(dt))}${row('상담 방법', cell(A.method))}
        </div>
        ${row('실제 상담 내용', cell(A.content), '58px')}
        ${row('부모님 질문 및 답변 내용', qs.length ? html`<div>${qs.map((q, i) => html`<div key=${q.id} style=${{marginBottom:'3px'}}><b>Q${i + 1}. ${q.q}</b><div>${has(A.qa[q.id]) ? A.qa[q.id] : html`<span className="blank g-ph">논의 내용 미기록</span>`}</div></div>`)}</div>` : html`<span className="g-ph">부모님 질문 없음</span>`, '58px')}
        ${row('부모님 의견', cell(A.opinion), '44px')}
        ${row('교사가 안내한 내용', cell(A.guided), '44px')}
        ${row('양육 고민에 대해 함께 논의한 사항', cell(A.concern), '44px')}
        ${row('가정과 협의한 지원 방법', cell(A.support), '44px')}
        ${row('실제 제공한 부모교육자료', cell(A.eduProvided === 'yes' ? (A.eduTitle || '제공함') : A.eduProvided === 'no' ? '제공하지 않음' : ''))}
        ${row('추후 관찰 및 점검 사항', cell(A.followup), '44px')}
        ${row('상담 교사 확인', html`<div className="af-sign">${A.teacherName || b.teacher || ''} <span>(서명)</span></div>`)}
      </${A4}>
    </div>
  </div>`;
}

    <div className="pagehead"><div className="grow"><h2>${info.t}</h2><p>이 화면은 ${info.v} 버전에서 만들어집니다. 지금 입력하는 자료는 그대로 이어서 사용됩니다.</p></div></div>
    <div className="card"><h3>${info.v} 버전에서 추가될 기능</h3><ul className="checklist">${info.d.map((x,i)=>html`<li key=${i}><span className="ic q"><${Icon} n="leaf" size=${13}/></span><span>${x}</span></li>`)}</ul></div>
    ${kind==='guide' && ctx.cur && html`<div className="card"><h3>미리 확인: ${displayName(ctx.cur)}의 부모님 질문</h3>${ctx.cur.questions.length? html`<ul className="checklist">${ctx.cur.questions.map((q,i)=>html`<li key=${q.id}><span className="qnum">${i+1}.</span><div><b>${q.q||'(질문 미입력)'}</b><div className="small">${has(q.a)? q.a : html`<span className="chip warn">답변 준비 필요</span>`}</div><div className="small muted">${q.mode? Q_MODES.find(m=>m[0]===q.mode)[1] : '전달 방식 미선택'}</div></div></li>`)}</ul>` : html`<p className="muted">등록된 질문이 없어요.</p>`}</div>`}
  </div>`;
}

/* ───────── 저장 및 출력 ───────── */
function SaveView({ctx}){
  const {db,setDb,cur,saveNow,saveState,say,setModal,unexported,copyToNext,setView}=ctx;
  const [scope,setScope]=useState(cur?'current':'term');
  const [withPhotos,setWithPhotos]=useState(false);
  const [jsonText,setJsonText]=useState('');
  const [pasteText,setPasteText]=useState('');
  const [mode,setMode]=useState('merge');
  const outRef=useRef(); const fileRef=useRef();

  const pick=()=> scope==='current'&&cur? [cur] : scope==='term'? termRecords({...db,session:{...db.session,onlyMine:false}}) : db.records;
  const build=()=>{
    const recs=pick().map(r=> withPhotos? r : {...r, photos:Object.fromEntries(['main','play'].map(s=>[s,{...r.photos[s],src:null,missing:r.photos[s].missing||!!r.photos[s].src}]))});
    return JSON.stringify({app:APP_ID,version:1,exportedAt:nowISO(),org:ORG,scope,photosIncluded:withPhotos,teachers:db.teachers,records:recs},null,2);
  };
  const fname=()=>{ const d=todayStr().replace(/-/g,''); const s=scope==='current'&&cur? displayName(cur).replace(/[\\/:*?"<>|\s]/g,'') : scope==='term'? `${db.session.year}-${db.session.semester}학기` : '전체'; return `이음상담ON_${s}_${d}.json`; };
  const markExported=()=> setDb(d=>({...d,lastExportAt:nowISO()}));
  const doDownload=()=>{ const t=build(); setJsonText(t); if(downloadText(fname(),t)){ markExported(); say(inIframe? '파일 저장을 요청했어요. 저장되지 않았다면 아래 "JSON 복사"를 사용해 주세요.' : '파일을 내보냈어요.'); } else say('이 화면에서는 파일 저장이 막혀 있어요. "JSON 복사"를 사용해 주세요.'); };
  const doCopy=async()=>{ const t=build(); setJsonText(t); setTimeout(async()=>{ const ok=await copyText(t,outRef.current); if(ok){ markExported(); say('JSON을 복사했어요. 메모장 등에 붙여넣어 .json 파일로 저장해 주세요.'); } else say('자동 복사가 막혀 있어요. 아래 상자의 내용이 선택되었으니 Ctrl+C로 복사해 주세요.'); },0); };

  const importData=(text)=>{
    let data; try{ data=JSON.parse(text); }catch(e){ say('JSON 형식이 올바르지 않아요. 내보낸 파일 내용을 그대로 붙여넣어 주세요.'); return; }
    if(!data || data.app!==APP_ID || !Array.isArray(data.records)){ say('이음 상담ON에서 내보낸 파일이 아니에요.'); return; }
    const recs=data.records.map(normalizeRecord);
    const exist=new Map(db.records.map(r=>[r.id,r]));
    const nNew=recs.filter(r=>!exist.has(r.id)).length; const nSame=recs.length-nNew;
    const noPhoto=!data.photosIncluded && recs.some(r=>r.photos.main.missing||r.photos.play.missing);
    setModal({title:'자료를 불러올까요?',confirmLabel:'불러오기',danger:mode==='replace',
      body:html`<p>파일 속 자료 ${recs.length}건 (새 자료 ${nNew}건, 같은 자료 ${nSame}건) · 내보낸 시각 ${fmtDateTime(data.exportedAt)}</p>
        ${mode==='merge'? html`<p>같은 자료는 <b>더 최근에 수정된 쪽</b>을 남기고, 나머지 자료는 그대로 둡니다.</p>` : html`<p style=${{color:'var(--danger)'}}><b>이 브라우저의 모든 자료를 지우고</b> 파일 내용으로 바꿉니다.</p>`}
        ${noPhoto && html`<p className="muted">이 파일에는 사진이 포함되어 있지 않아요. 불러온 뒤 STEP 8에서 사진을 다시 첨부해 주세요.</p>`}`,
      onConfirm:()=>{
        setDb(d=>{
          const teachers=[...d.teachers]; (data.teachers||[]).forEach(t=>{ if(t&&t.id&&!teachers.find(x=>x.id===t.id)) teachers.push(t); });
          if(mode==='replace') return {...d,teachers:data.teachers||[],records:recs,lastExportAt:nowISO()};
          const map=new Map(d.records.map(r=>[r.id,r]));
          recs.forEach(r=>{ const o=map.get(r.id); if(!o) map.set(r.id,r); else if((r.updatedAt||'')>(o.updatedAt||'')){ const keep={...r}; ['main','play'].forEach(s=>{ if(!keep.photos[s].src && o.photos[s].src){ keep.photos[s]={...keep.photos[s],src:o.photos[s].src,missing:false}; } }); map.set(r.id,keep); } });
          return {...d,teachers,records:[...map.values()]};
        });
        setPasteText(''); say('자료를 불러왔어요.');
      }});
  };
  const onFile=e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return; const fr=new FileReader(); fr.onload=()=>importData(String(fr.result)); fr.onerror=()=>say('파일을 읽지 못했어요.'); fr.readAsText(f,'utf-8'); };

  const lsSize=(()=>{ try{ let n=0; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('eum-sangdam-on')) n+=(localStorage.getItem(k)||'').length; } return (n*2/1024/1024).toFixed(1); }catch(e){ return '?'; } })();

  return html`<div className="stack">
    <div className="pagehead"><div className="grow"><h2>저장 및 출력</h2><p>무료 환경에서 쓸 수 있는 방식으로 자료를 저장합니다. 브라우저 임시 저장은 기기를 바꾸거나 사이트 데이터를 지우면 사라질 수 있으니, JSON 파일 백업을 꼭 함께 해 주세요.</p></div></div>
    ${inIframe && html`<div className="notice warn"><${Icon} n="alert"/><div><b>미리보기 창에서 사용 중이에요.</b> 이 화면에서는 파일 다운로드와 인쇄가 막힐 수 있어요. 이럴 때는 "JSON 복사"로 백업하고, 인쇄가 필요하면 프로그램 HTML 파일을 Chrome이나 Edge에서 직접 열어 사용해 주세요.</div></div>`}

    <div className="card">
      <h3>브라우저 임시 저장</h3>
      <dl className="kv"><dt>상태</dt><dd>${saveState.ok? `자동 저장 중 · 마지막 저장 ${saveState.at?fmtDateTime(saveState.at):'—'}` : html`<span style=${{color:'var(--danger)'}}>저장 실패 (저장 공간 부족 또는 브라우저 설정)</span>`}</dd>
        <dt>사용 용량</dt><dd>약 ${lsSize}MB (브라우저 한도 보통 5MB · 사진이 대부분을 차지해요)</dd>
        <dt>파일 백업</dt><dd>${db.lastExportAt? `마지막 내보내기 ${fmtDateTime(db.lastExportAt)}` : '아직 내보낸 적이 없어요'}${unexported>0? html` · <span style=${{color:'var(--warn)'}}>백업 이후 바뀐 자료 ${unexported}건</span>`:''}</dd></dl>
      <div className="row" style=${{marginTop:'12px'}}><button className="btn primary" onClick=${()=>{ if(saveNow(db)) say('이 브라우저에 저장했어요.'); else say('저장에 실패했어요. JSON 파일로 내보내 주세요.'); }}><${Icon} n="save"/>지금 저장</button></div>
    </div>

    <div className="card stack">
      <h3 style=${{marginBottom:0}}>JSON 파일로 내보내기</h3>
      <div className="field"><span className="lbl">내보낼 범위</span><div className="choice">
        <label><input type="radio" name="ex-scope" disabled=${!cur} checked=${scope==='current'} onChange=${()=>setScope('current')}/>현재 영유아${cur?` (${displayName(cur)})`:''}</label>
        <label><input type="radio" name="ex-scope" checked=${scope==='term'} onChange=${()=>setScope('term')}/>${termLabel(db.session.year,db.session.semester)} 전체</label>
        <label><input type="radio" name="ex-scope" checked=${scope==='all'} onChange=${()=>setScope('all')}/>모든 학기 (${db.records.length}건)</label></div></div>
      <label className="row small" style=${{gap:'8px'}}><input type="checkbox" id="ex-photos" checked=${withPhotos} onChange=${e=>setWithPhotos(e.target.checked)} style=${{accentColor:'var(--sage-deep)'}}/>사진 포함 (파일이 커져요. 포함하지 않으면 불러온 뒤 사진을 다시 첨부해야 해요)</label>
      <div className="row"><button className="btn primary" onClick=${doDownload}><${Icon} n="download"/>JSON 파일 내보내기</button><button className="btn" onClick=${doCopy}><${Icon} n="copy"/>JSON 복사</button></div>
      ${jsonText && html`<div className="field"><label htmlFor="json-out">내보낸 내용</label><textarea id="json-out" ref=${outRef} className="code" readOnly value=${jsonText}></textarea></div>`}
    </div>

    <div className="card stack">
      <h3 style=${{marginBottom:0}}>JSON 파일 불러오기</h3>
      <div className="field"><span className="lbl">불러오는 방식</span><div className="choice">
        <label><input type="radio" name="im-mode" checked=${mode==='merge'} onChange=${()=>setMode('merge')}/>기존 자료와 합치기</label>
        <label><input type="radio" name="im-mode" checked=${mode==='replace'} onChange=${()=>setMode('replace')}/>전체 바꾸기</label></div></div>
      <input ref=${fileRef} type="file" accept=".json,application/json" hidden onChange=${onFile} id="im-file"/>
      <div className="row"><button className="btn primary" onClick=${()=>fileRef.current.click()}><${Icon} n="upload"/>파일 선택</button><span className="muted small">또는 아래에 내용을 붙여넣기</span></div>
      <textarea id="im-paste" className="code" placeholder="내보낸 JSON 내용을 붙여넣어 주세요" value=${pasteText} onChange=${e=>setPasteText(e.target.value)} style=${{minHeight:'90px'}}></textarea>
      <div><button className="btn" disabled=${!pasteText.trim()} onClick=${()=>importData(pasteText)}>붙여넣은 내용 불러오기</button></div>
    </div>

    <div className="card">
      <h3>이전 학기 기록 복사</h3>
      <p className="muted small" style=${{marginBottom:'10px'}}>선택한 기록의 기본정보와 "현재 모습"을 다음 학기 자료로 이어서 만듭니다. 원래 기록은 그대로 남아요.</p>
      ${db.records.length? html`<div className="row">${db.records.slice().sort((a,b)=>(b.basic.year*10+b.basic.semester)-(a.basic.year*10+a.basic.semester)).map(r=>html`<button key=${r.id} className="btn sm" onClick=${()=>copyToNext(r)}><${Icon} n="copy" size=${14}/>${displayName(r)} · ${r.basic.year}-${r.basic.semester}학기 → 다음 학기</button>`)}</div>` : html`<p className="muted">기록이 없어요.</p>`}
    </div>

    <div className="card">
      <h3>출력 (인쇄 · PDF 저장)</h3>
      <div className="notice"><${Icon} n="print"/><div>문서마다 검토·승인 체크 후 인쇄할 수 있어요. 인쇄는 브라우저의 인쇄 기능(PDF로 저장)을 사용하며, 미리보기 창이 아닌 Chrome·Edge에서 HTML 파일을 직접 열었을 때 작동합니다. 인쇄 창에서 "배경 그래픽"을 켜고, 여백은 "없음", 용지는 A4로 설정해 주세요.</div></div>
      <div className="row" style=${{marginTop:'12px'}}>
        <button className="btn" onClick=${()=>setView('report')}>학부모용 성장 리포트</button>
        <button className="btn" onClick=${()=>setView('report')} title="리포트 편집 화면에서 '부모교육자료만 인쇄'를 눌러요">부모교육자료만 출력</button>
        <button className="btn" onClick=${()=>setView('guide')}>교사용 상담 가이드</button>
        <button className="btn" onClick=${()=>setView('after')}>상담 후 결과 기록지</button></div>
    </div>

        <div className="card">
      <h3 style=${{color:'var(--danger)'}}>자료 초기화</h3>
      <p className="muted small" style=${{marginBottom:'10px'}}>이 브라우저에 저장된 모든 상담자료와 사진을 지우고 처음 상태(예시 자료)로 되돌립니다. 먼저 JSON 파일로 백업해 두세요.</p>
      <button className="btn danger" onClick=${()=>setModal({title:'모든 자료를 초기화할까요?',danger:true,confirmLabel:'모두 지우고 초기화',body:html`<p>영유아 ${db.records.filter(r=>!r.sample).length}명의 자료와 사진, 교사 목록이 이 브라우저에서 모두 지워집니다. 되돌릴 수 없습니다.</p>${unexported>0&&html`<p style=${{color:'var(--danger)'}}><b>파일로 백업하지 않은 변경 ${unexported}건이 있어요.</b></p>`}`,
        onConfirm:()=>{ try{ Object.keys(localStorage).filter(k=>k.startsWith('eum-sangdam-on')).forEach(k=>localStorage.removeItem(k)); }catch(e){} Object.keys(photoSig).forEach(k=>delete photoSig[k]); const s=seedDB(); setDb(s); ctx.setCurId(null); ctx.setView('dash'); say('초기화했어요.'); }})}><${Icon} n="trash"/>전체 자료 초기화</button>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
