<title>이음 상담ON</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 메뉴 + (왼쪽 단계 · 가운데 입력 · 오른쪽 상태) 3단 작업 화면, 태블릿에서 2단, 좁은 화면에서 1단 */
:root{
  --bg:#FBF8F1;        /* 아이보리 */
  --surface:#FFFDF9;
  --surface-2:#F5EFE3; /* 따뜻한 베이지 */
  --line:#E7DECD;
  --ink:#38392F;
  --muted:#77746A;
  --sage:#7F9C7B;      /* 세이지 그린 */
  --sage-deep:#557052;
  --sage-soft:#E8EFE3;
  --apricot:#EDB892;   /* 살구 */
  --apricot-soft:#FBEBDD;
  --warn:#B4692F;
  --warn-soft:#FBEADB;
  --danger:#B24A3F;
  --danger-soft:#F8E1DD;
  --ok:#4F7A4B;
  --info-soft:#EAF0F2;
  --shadow:0 1px 2px rgba(80,70,40,.06),0 4px 14px rgba(80,70,40,.06);
  --font-display:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E201B;--surface:#272A24;--surface-2:#30332B;--line:#3D4137;--ink:#ECE8DD;--muted:#A9A597;
  --sage:#98B593;--sage-deep:#B8D0B2;--sage-soft:#2E3A2C;--apricot:#D9A07A;--apricot-soft:#3E3026;
  --warn:#E3A06B;--warn-soft:#3E3024;--danger:#E58A7F;--danger-soft:#422A27;--ok:#9CC797;--info-soft:#28323A;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E201B;--surface:#272A24;--surface-2:#30332B;--line:#3D4137;--ink:#ECE8DD;--muted:#A9A597;
  --sage:#98B593;--sage-deep:#B8D0B2;--sage-soft:#2E3A2C;--apricot:#D9A07A;--apricot-soft:#3E3026;
  --warn:#E3A06B;--warn-soft:#3E3024;--danger:#E58A7F;--danger-soft:#422A27;--ok:#9CC797;--info-soft:#28323A;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sage-deep);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand h1{font-size:23px;color:var(--sage-deep);letter-spacing:-.01em}
.brand .slogan{font-size:12.5px;color:var(--muted)}
.ctxbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctxbar label{font-size:12px;color:var(--muted)}
.ctxbar select{padding:5px 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--sage-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.apricot{background:var(--apricot-soft);color:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;padding-bottom:0}
.tab{border:0;background:none;padding:9px 14px 10px;border-bottom:2.5px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:14.5px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--sage-deep);border-bottom-color:var(--sage);font-weight:600}
.tab .soon{font-size:10.5px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:400}

main{padding-block:22px 60px}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h2{font-size:26px}
.pagehead p{color:var(--muted);font-size:14px}
.pagehead .grow{flex:1;min-width:240px;display:grid;gap:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:18.5px;margin-bottom:10px}
.card + .card{margin-top:16px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.soft{background:var(--sage-soft);border-color:transparent;color:var(--sage-deep)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.danger.solid{background:var(--danger);color:var(--bg);border-color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.icon{padding:6px;border-radius:50%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* notices */
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--info-soft);font-size:13.5px}
.notice.warn{background:var(--warn-soft)}
.notice.apricot{background:var(--apricot-soft)}
.notice.sage{background:var(--sage-soft)}
.notice svg{flex:none;margin-top:2px}
.notice b{font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:2px}
.stat .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--font-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:14px;color:var(--muted);margin-left:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:12.5px;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.namecell{display:flex;align-items:center;gap:8px;font-weight:500}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sage-soft);color:var(--sage-deep);display:grid;place-items:center;font-size:13px;flex:none;font-family:var(--font-display)}
.tag-sample{font-size:11px;padding:0 6px;border-radius:6px;background:var(--apricot-soft);color:var(--warn);font-weight:400}

/* status pill */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-draft{background:var(--apricot-soft);color:var(--warn)}
.st-done{background:var(--info-soft);color:var(--ink)}
.st-reviewed{background:var(--sage-soft);color:var(--sage-deep)}
.st-counseled{background:var(--sage-deep);color:var(--bg)}

/* write layout */
.write{display:grid;grid-template-columns:236px minmax(0,1fr) 292px;gap:20px;align-items:start}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);display:grid;gap:4px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.steps .who{padding:4px 6px 10px;border-bottom:1px dashed var(--line);margin-bottom:6px}
.steps .who b{font-family:var(--font-display);font-weight:400;font-size:17px;display:block}
.stepbtn{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:0;background:none;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;width:100%}
.stepbtn:hover{background:var(--surface-2)}
.stepbtn[aria-current="step"]{background:var(--sage-soft)}
.stepbtn .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.stepbtn.full .n{background:var(--sage);color:var(--bg)}
.stepbtn.part .n{background:var(--apricot-soft);color:var(--warn)}
.stepbtn[aria-current="step"] .n{outline:2px solid var(--sage-deep);outline-offset:1px}
.stepbtn .t{font-size:13.5px;line-height:1.35;display:grid}
.stepbtn .t small{font-size:11.5px;color:var(--muted)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);display:grid;gap:12px}
.side .card{padding:16px}
.side .card + .card{margin-top:0}
.side h4{font-size:15.5px;margin-bottom:8px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:999px;transition:width .3s}
.plist{display:grid;gap:6px;font-size:13px;margin:0;padding:0;list-style:none}
.plist li{display:flex;gap:8px;align-items:flex-start}
.plist .pg{flex:none;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.plist .off{color:var(--muted);text-decoration:line-through}
.navbtns{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}

.stephead{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.stephead .big{font-family:var(--font-display);font-size:15px;color:var(--sage-deep);background:var(--sage-soft);border-radius:var(--r-md);padding:6px 10px;flex:none}
.stephead h2{font-size:24px}
.stephead p{color:var(--muted);font-size:14px;margin-top:2px}

/* form */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
.span2{grid-column:span 2}
.field{display:grid;gap:5px;min-width:0}
.field > label,.lbl{font-size:13.5px;font-weight:500}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:-3px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--sage);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--sage-soft)}
textarea{resize:vertical;min-height:62px;field-sizing:content;max-height:420px;line-height:1.55}
textarea.filled,input.filled{background:var(--surface)}
.qnum{font-family:var(--font-display);color:var(--sage-deep);margin-right:4px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13.5px;background:var(--bg)}
.choice label:has(input:checked){background:var(--sage-soft);border-color:var(--sage);color:var(--sage-deep);font-weight:500}
.choice input{accent-color:var(--sage-deep);margin:0}
.computed{padding:9px 11px;border-radius:var(--r-sm);background:var(--sage-soft);color:var(--sage-deep);font-size:14px}

/* domain blocks */
.domain{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.domain + .domain{margin-top:12px}
.domain > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px}
.domain > summary::-webkit-details-marker{display:none}
.domain > summary h3{font-size:17px;margin:0}
.domain > summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.domain[open] > summary .chev{transform:rotate(180deg)}
.domain .body{padding:0 16px 16px;display:grid;gap:12px}
.mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--apricot-soft);color:var(--warn);font-size:12px;font-family:var(--font-display);flex:none}
.episode{border:1px dashed var(--line);border-radius:var(--r-md);padding:12px;display:grid;gap:10px;background:var(--bg)}
.episode .eh{display:flex;align-items:center;gap:8px}

.qcard{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--surface);display:grid;gap:12px}
.qcard .qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qcard .qh b{font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--sage-deep)}
.qcard .tools{margin-left:auto;display:flex;gap:4px}

/* photos */
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pslot{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--surface);display:grid;gap:12px;min-width:0}
.frame{position:relative;width:100%;max-width:100%;overflow:hidden;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.frame img{width:100%;height:100%;display:block;max-width:none}
.frame.empty{display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:12px;border-style:dashed}
.range{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px}
.range input{accent-color:var(--sage-deep);width:100%}

/* help */
.help{border-radius:var(--r-md);background:var(--surface-2);padding:12px 14px;font-size:13.5px}
.help summary{cursor:pointer;font-weight:500}
.help .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.help ul{margin:4px 0 0;padding-left:18px;display:grid;gap:3px}
.help .no li::marker{color:var(--danger)}
.help .yes li::marker{color:var(--sage-deep)}

/* modal & toast */
.backdrop{position:fixed;inset:0;background:rgba(30,28,20,.42);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-lg);max-width:520px;width:100%;padding:22px;display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty-state{display:grid;justify-items:center;text-align:center;gap:10px;padding:36px 16px;color:var(--muted)}
.empty-state h3{color:var(--ink)}
.feat td:first-child{font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--line)}
.checklist .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.checklist .ic.y{background:var(--sage-soft);color:var(--ok)}
.checklist .ic.n{background:var(--warn-soft);color:var(--warn)}
.checklist .ic.q{background:var(--surface-2);color:var(--muted)}
textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:160px;field-sizing:fixed}

/* ── A4 문서 (종이는 테마와 무관하게 밝게 유지) ── */
:root{--paper:#FFFEFA;--paper-ink:#34362C;--paper-line:#E5DCC8;--paper-sage:#6F8D6B;--paper-sage-deep:#4B6648;--paper-sage-soft:#EAF0E4;--paper-apricot:#F2C9A6;--paper-apricot-soft:#FBEBDD;--paper-muted:#7B7868;--paper-danger:#A94A3D;--paper-danger-soft:#F8E4DF}
.docs{display:grid;gap:26px;justify-items:start;overflow-x:auto;padding:4px 2px 14px;max-width:100%}
.pagebox{display:grid;gap:6px;justify-items:start}
.pagebar{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.page{width:794px;height:1123px;flex:none;background:var(--paper);color:var(--paper-ink);padding:44px 48px;box-shadow:0 2px 14px rgba(60,50,20,.18);border:1px solid var(--paper-line);position:relative;font-size:13px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.page.over{outline:3px solid var(--danger)}
.page .flow{display:flow-root}
.page h2,.page h3,.page h4{font-family:var(--font-display);font-weight:400;color:var(--paper-ink)}
.ed{outline:none;white-space:pre-wrap;border-radius:5px;transition:background .15s;min-width:2em}
.ed:hover{background:rgba(111,141,107,.13)}
.ed:focus{background:rgba(242,201,166,.3)}
.ed:empty:before{content:attr(data-ph);color:var(--paper-muted);opacity:.75}
.blk{position:relative}
.delx{position:absolute;top:-2px;right:-2px;width:20px;height:20px;border-radius:50%;border:0;background:var(--paper-danger);color:#fff;font-size:13px;line-height:1;cursor:pointer;display:none;padding:0}
.blk:hover>.delx{display:block}
.addx{border:1px dashed var(--paper-sage);background:none;color:var(--paper-sage-deep);border-radius:999px;font-size:12px;padding:1px 10px;cursor:pointer;margin-top:4px}
.rp-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--paper-sage-deep)}
.rp-title{font-size:30px!important;color:var(--paper-sage-deep)!important;margin:2px 0 10px;line-height:1.3}
.rp h4,.rp-sec{font-size:16px;color:var(--paper-sage-deep)!important;border-bottom:1.5px dotted var(--paper-apricot);padding-bottom:3px;margin:14px 0 7px}
.rp-cols{display:flex;gap:18px;align-items:flex-start}
.rp-left{flex:1;min-width:0}
.rp-info{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0 0 4px;padding:10px 14px;background:var(--paper-sage-soft);border-radius:12px}
.rp-info dt{color:var(--paper-muted)}
.rp-info dd{margin:0;font-weight:500}
.rphoto{margin:0;display:grid;gap:4px;justify-items:center;flex:none;max-width:48%}
.rframe{overflow:hidden;border-radius:14px;border:1px solid var(--paper-line);background:#f3eee2;max-width:100%}
.rphoto figcaption{font-size:11.5px;color:var(--paper-muted);text-align:center}
.rp-p{margin:0}
.rp-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rp-strengths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rp-card{background:var(--paper-apricot-soft);border-radius:12px;padding:9px 12px;position:relative}
.rp-card b{font-family:var(--font-display);font-weight:400;font-size:14.5px;color:var(--paper-sage-deep);display:block}
.rp-domain{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--paper-line);position:relative}
.rp-domain b{font-family:var(--font-display);font-weight:400;color:var(--paper-sage-deep)}
.rp-safe{background:var(--paper-apricot-soft);border-radius:12px;padding:10px 14px;margin-top:10px}
.rp-safe h4{border:0!important;margin:0 0 4px!important}
.rp-qa{display:grid;gap:7px}
.rp-qa .q{font-size:12px;color:var(--paper-muted)}
.rp-close{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--paper-sage-soft)}

/* 이전 버전/불러온 자료의 빈 칸을 기본 구조로 채움 */
function normalizeRecord(r){
  const base = emptyRecord({teacherId:null,year:r?.basic?.year||defaultTerm().year,semester:r?.basic?.semester||defaultTerm().semester},[]);
  const out = {...base, ...r};
  ['basic','survey','growth','safety','focus','concern'].forEach(k=> out[k]={...base[k], ...(r[k]||{})});
  out.obs = {...base.obs, ...(r.obs||{})};
  OBS.forEach(d=>{ out.obs[d.key]={...base.obs[d.key], ...((r.obs||{})[d.key]||{})}; });
  out.obs._ep = {...base.obs._ep, ...((r.obs||{})._ep||{})};
  out.photos = {main:{...emptyPhoto(), ...((r.photos||{}).main||{})}, play:{...emptyPhoto(), ...((r.photos||{}).play||{})}};
  out.questions = Array.isArray(r.questions)? r.questions.map(q=>({id:q.id||uid('q'),q:q.q||'',a:q.a||'',mode:q.mode||''})) : [];
  out.after={...emptyAfter(),...(r.after||{}),qa:{...((r.after||{}).qa||{})}};
  const ba=emptyAI(), ra=r.ai||{};
  out.ai={...ba,...ra,approved:{...ba.approved,...(ra.approved||{})},titles:{...ba.titles,...(ra.titles||{})},check:{...(ra.check||{})},tight:{...(ra.tight||{})}};
  out.basic.year = Number(out.basic.year)||base.basic.year;
  out.basic.semester = Number(out.basic.semester)||base.basic.semester;
  return out;
}

/* ───────── 진행률 ───────── */
function stepProgress(rec, key){
  switch(key){
    case 'basic': { const b=rec.basic; const ks=['name','birth','className','teacher','date','time','method']; return {filled:ks.filter(k=>has(b[k])).length,total:ks.length}; }
    case 'survey': return {filled:SURVEY.filter(([k])=>has(rec.survey[k])).length,total:SURVEY.length};
    case 'obs': { let t=0,f=0; OBS.forEach(d=>d.items.forEach(([k])=>{t++; if(has(rec.obs[d.key][k])) f++;})); const ep=OBS.reduce((s,d)=>s+(rec.obs._ep[d.key]||[]).length,0); return {filled:f,total:t,extra:ep}; }
    case 'growth': { const ks=GROWTH.map(g=>g[0]).filter(k=>k!=='prev'); return {filled:ks.filter(k=>has(rec.growth[k])).length + (has(rec.growth.prev)?1:0), total:GROWTH.length}; }
    case 'safety': { const s=rec.safety; const f=(s.areas.length?1:0)+SAFETY_Q.filter(([k])=>has(s[k])).length; return {filled:f,total:SAFETY_Q.length+1}; }
    case 'focus': return {filled:FOCUS.filter(([k])=>has(rec.focus[k])).length,total:FOCUS.length};
    case 'questions': { const qs=rec.questions; if(!qs.length) return {filled:0,total:0}; const f=qs.filter(q=>has(q.q)&&has(q.a)&&q.mode).length; return {filled:f,total:qs.length}; }
    case 'photos': { const f=['main','play'].filter(s=>rec.photos[s].src).length; return {filled:f,total:2}; }
    case 'concern': { const c=rec.concern; const ks=['text','observed','suggest','home','include']; const f=ks.filter(k=>has(c[k])).length+(c.topics.length?1:0)+(c.generate?1:0); return {filled:f,total:7}; }
  }
  return {filled:0,total:0};
}
function stepState(rec, step){
  if(step.key==='ai') return rec.ai.result ? {cls:'full',label:'만들어짐'} : {cls:'',label:'아직 만들지 않음'};
  const p=stepProgress(rec, step.key);
  if(step.key==='questions'){ if(!p.total) return {cls:'',label:'질문 없음'}; return p.filled===p.total? {cls:'full',label:`질문 ${p.total}개 준비`} : {cls:'part',label:`답변 준비 필요 ${p.total-p.filled}`}; }
  if(step.key==='obs'){ if(!p.filled) return {cls:'',label:'미작성'}; return {cls: p.filled>=8?'full':'part', label:`메모 ${p.filled}개${p.extra?` · 일화 ${p.extra}`:''}`}; }
  if(!p.filled) return {cls:'', label: step.optional? '선택 · 비어 있음' : '미작성'};
  if(p.filled>=p.total) return {cls:'full',label:'입력 완료'};
  return {cls:'part',label:`${p.filled}/${p.total} 입력`};
}
function overallProgress(rec){
  const req=STEPS.filter(s=>!s.optional);
  let done=0;
  req.forEach(s=>{ const p=stepProgress(rec,s.key); if(s.key==='obs') done+= Math.min(1,p.filled/8); else if(s.key==='questions') done+= p.total? p.filled/p.total : 1; else done+= p.total? p.filled/p.total : 0; });
  return Math.round(done/req.length*100);
}
const wantsEdu = rec => rec.concern.generate==='yes' || !!rec.safety.makeEdu;
const safetyFilled = rec => rec.safety.areas.length>0 || SAFETY_Q.some(([k])=>has(rec.safety[k]));

function cautionHits(rec){
  const spots=[];
  OBS.forEach(d=>{ d.items.forEach(([k,l])=>spots.push([`관찰 · ${d.title} · ${l}`, rec.obs[d.key][k]])); (rec.obs._ep[d.key]||[]).forEach((e,i)=>['situation','behavior','support','response'].forEach(f=>spots.push([`관찰 일화 · ${d.title} ${i+1}`, e[f]]))); });
  GROWTH.forEach(([k,l])=>spots.push([`성장 · ${l}`, rec.growth[k]]));
  SAFETY_Q.forEach(([k,l])=>spots.push([`안전·건강 · ${l}`, rec.safety[k]]));
  FOCUS.forEach(([k,l])=>spots.push([`핵심 주제 · ${l}`, rec.focus[k]]));
  rec.questions.forEach((q,i)=>spots.push([`질문 ${i+1} 답변`, q.a]));
  CONCERN_Q.forEach(([k,l])=>spots.push([`양육 고민 · ${l}`, rec.concern[k]]));
  const hits=[];
  spots.forEach(([where,text])=>{ if(!has(text)) return; CAUTION.forEach(([p,tip])=>{ if(text.includes(p)) hits.push({where,phrase:p,tip}); }); });
  return hits;
}

/* ───────── 저장소 ───────── */
const photoSig = {}; // 이미 저장한 사진은 다시 쓰지 않음
function loadDB(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      const d=JSON.parse(raw);
      d.records=(d.records||[]).map(r=>{
        const rec=normalizeRecord(r);
        ['main','play'].forEach(s=>{ const p=rec.photos[s]; if(p.stored){ let src=null; try{ src=localStorage.getItem(PH_PREFIX+rec.id+':'+s); }catch(e){} if(src){ p.src=src; photoSig[rec.id+':'+s]=src.length+src.slice(-24); } else { p.missing=true; } delete p.stored; } });
        return rec;
      });
      d.teachers=d.teachers||[]; d.session={...defaultTerm(),teacherId:null,onlyMine:false,...(d.session||{})};
      return {db:d,fresh:false};
    }
  }catch(e){}
  return {db:seedDB(),fresh:true};
}
function persist(db){
  const errors=[];
  const lite={...db, records: db.records.map(r=>({...r, photos:Object.fromEntries(['main','play'].map(s=>{ const p=r.photos[s]; return [s,{...p, src:null, stored:!!p.src}]; }))}))};
  try{ localStorage.setItem(LS_KEY, JSON.stringify(lite)); }catch(e){ return {ok:false, errors:['기본 자료']}; }
  const keep=new Set();
  db.records.forEach(r=>['main','play'].forEach(s=>{
    const p=r.photos[s]; if(!p.src) return;
    const key=r.id+':'+s; keep.add(PH_PREFIX+key);
    const sig=p.src.length+p.src.slice(-24);
    if(photoSig[key]===sig) return;
    try{ localStorage.setItem(PH_PREFIX+key,p.src); photoSig[key]=sig; }catch(e){ errors.push(key); }
  }));
  try{ const rm=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(PH_PREFIX)&&!keep.has(k)) rm.push(k); } rm.forEach(k=>{ localStorage.removeItem(k); delete photoSig[k.slice(PH_PREFIX.length)]; }); }catch(e){}
  return {ok:true, photoErrors:errors};
}
function downloadText(name, text){
  try{ const blob=new Blob([text],{type:'application/json;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000); return true; }catch(e){ return false; }
}
async function copyText(text, fallbackEl){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){ if(fallbackEl){ fallbackEl.focus(); fallbackEl.select(); } return false; }
}
function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=1600; const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); const ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); res({src:c.toDataURL('image/jpeg',0.85),w:c.width,h:c.height}); }; img.onerror=()=>rej(new Error('img')); img.src=fr.result; };
    fr.onerror=()=>rej(new Error('read')); fr.readAsDataURL(file);
  });
}

const TEACHER_FIELD=/^(o-|ep-|g-|sf-|f-|a-|c-(observed|suggest|home|include)|af-(content|guided|concern|support|follow))/;
function Field({id,label,hint,value,onChange,rows=2,placeholder,type='textarea',num}){
  const v=value||'';
  const hit = type==='textarea' && has(v) && TEACHER_FIELD.test(id||'') ? CAUTION.find(([p])=>v.includes(p)) : null;
  return html`<div className="field">
    <label htmlFor=${id}>${num!=null && html`<span className="qnum">${num}.</span>`}${label}</label>
    ${hint && html`<p className="hint">${hint}</p>`}
    ${type==='textarea'
      ? html`<textarea id=${id} rows=${rows} className=${has(v)?'filled':''} value=${v} placeholder=${placeholder||''} onChange=${e=>onChange(e.target.value)}></textarea>`
      : html`<input id=${id} type=${type} className=${has(v)?'filled':''} value=${v} placeholder=${placeholder||''} onChange=${e=>onChange(e.target.value)}/>`}
    ${hit && html`<p className="hint cautionhint"><b>"${hit[0]}"</b> 표현이 있어요. ${hit[1]}</p>`}
  </div>`;
}
function StatusPill({s}){ return html`<span className=${'status st-'+s}>${STATUS_LABEL[s]||s}</span>`; }
function Modal({m,close}){
  if(!m) return null;
  return html`<div className="backdrop" onClick=${e=>{ if(e.target===e.currentTarget) close(); }}>
    <div className="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title">${m.title}</h3>
      <div className="small" style=${{display:'grid',gap:'8px'}}>${m.body}</div>
      <div className="row" style=${{justifyContent:'flex-end'}}>
        <button className="btn" onClick=${close}>${m.cancelLabel||'취소'}</button>
        ${m.onConfirm && html`<button className=${'btn '+(m.danger?'danger solid':'primary')} onClick=${()=>{ m.onConfirm(); close(); }}>${m.confirmLabel||'확인'}</button>`}
      </div>
    </div>
  </div>`;
}

  {key:'save',label:'저장 및 출력',icon:'save'},
];

function App(){
  const init = useMemo(loadDB,[]);
  const [db,setDb] = useState(init.db);
  const [view,setView] = useState('dash');
  const [curId,setCurId] = useState(null);
  const [step,setStep] = useState(1);
  const [modal,setModal] = useState(null);
  const [toast,setToast] = useState('');
  const [saveState,setSaveState] = useState({at:init.fresh?null:init.db.savedAt, ok:true});
  const toastT = useRef();

  const say = useCallback(msg=>{ setToast(msg); clearTimeout(toastT.current); toastT.current=setTimeout(()=>setToast(''),2600); },[]);

  /* 자동 임시 저장 */
  const saveNow = useCallback((d)=>{
    const stamped={...d, savedAt:nowISO()};
    const r=persist(stamped);
    if(!r.ok){ setSaveState({at:null,ok:false}); return false; }
    setSaveState({at:stamped.savedAt,ok:true,photoErrors:r.photoErrors});
    return true;
  },[]);
  const firstRun=useRef(true);
  useEffect(()=>{
    if(firstRun.current){ firstRun.current=false; return; }
    const t=setTimeout(()=>saveNow(db),700);
    return ()=>clearTimeout(t);
  },[db,saveNow]);

  useEffect(()=>{ const h=e=>{ if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='s'){ e.preventDefault(); say(saveNow(db)?'이 브라우저에 저장했어요.':'저장에 실패했어요. JSON 파일로 내보내 주세요.'); } }; window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h); },[db,saveNow,say]);

  const unexported = useMemo(()=> db.records.filter(r=>!r.sample && (!db.lastExportAt || r.updatedAt>db.lastExportAt)).length,[db]);
  useEffect(()=>{
    const h=e=>{ if(unexported>0){ e.preventDefault(); e.returnValue=''; } };
    window.addEventListener('beforeunload',h); return ()=>window.removeEventListener('beforeunload',h);
  },[unexported]);

  const updateRecord = useCallback((id, fn)=>{
    setDb(d=>({...d, records:d.records.map(r=> r.id===id ? {...fn(r), updatedAt:nowISO()} : r)}));
  },[]);
  const setField = useCallback((id,path,val)=> updateRecord(id, r=>setIn(r,path,val)),[updateRecord]);

  const cur = db.records.find(r=>r.id===curId) || null;
  const openRecord = (id, s=1)=>{ setCurId(id); setStep(s); setView('write'); window.scrollTo({top:0}); };
  const newRecord = ()=>{ const r=emptyRecord(db.session,db.teachers); setDb(d=>({...d,records:[...d.records,r]})); openRecord(r.id,1); say('새 영유아 자료를 만들었어요. 기본정보부터 입력해 주세요.'); };
  const deleteRecord = (rec)=> setModal({title:'자료를 삭제할까요?',danger:true,confirmLabel:'삭제하기',
    body:html`<p><b>${displayName(rec)}</b> · ${termLabel(rec.basic.year,rec.basic.semester)} 상담자료가 이 브라우저에서 삭제됩니다.</p><p className="muted">JSON 파일로 내보내 둔 자료는 파일에 그대로 남아 있습니다. 삭제 후에는 되돌릴 수 없습니다.</p>`,
    onConfirm:()=>{ setDb(d=>({...d,records:d.records.filter(r=>r.id!==rec.id)})); if(curId===rec.id) setCurId(null); say('자료를 삭제했어요.'); }});
  const copyToNext = (rec)=>{
    const nt=nextTerm(rec.basic.year,rec.basic.semester);
    const exists=db.records.find(r=>r.childKey===rec.childKey && r.basic.year===nt.year && r.basic.semester===nt.semester);
    if(exists){ setModal({title:'이미 다음 학기 자료가 있어요',body:html`<p>${displayName(rec)}의 ${termLabel(nt.year,nt.semester)} 자료가 이미 있습니다.</p>`,cancelLabel:'닫기',confirmLabel:'그 자료 열기',onConfirm:()=>openRecord(exists.id)}); return; }
    setModal({title:'다음 학기 자료를 만들까요?',confirmLabel:'만들기',
      body:html`<p><b>${displayName(rec)}</b>의 ${termLabel(nt.year,nt.semester)} 자료를 새로 만듭니다.</p><ul style=${{margin:0,paddingLeft:'18px'}}><li>기본정보(이름, 생년월일, 반, 담당 교사)를 복사합니다.</li><li>이번 학기 STEP 4 "현재 모습"을 다음 학기 "지난 학기 모습"으로 옮겨 둡니다.</li><li>설문·관찰·질문·사진은 새 학기에 새로 입력합니다. 이전 기록은 그대로 보관됩니다.</li></ul>`,
      onConfirm:()=>{
        const r=emptyRecord(db.session,db.teachers);
        r.childKey=rec.childKey; r.prevId=rec.id; r.teacherId=rec.teacherId;
        r.basic={...r.basic,name:rec.basic.name,birth:rec.basic.birth,className:rec.basic.className,teacher:rec.basic.teacher,year:nt.year,semester:nt.semester};
        r.growth.prev = rec.growth.now || '';
        setDb(d=>({...d,records:[...d.records,r]}));
        say(`${termLabel(nt.year,nt.semester)} 자료를 만들었어요. 상단 학기 선택을 바꾸면 목록에서 볼 수 있어요.`);
      }});
  };
  const setSession = patch => setDb(d=>({...d,session:{...d.session,...patch}}));

  const ctx = {db,setDb,cur,curId,setCurId,step,setStep,view,setView,openRecord,newRecord,deleteRecord,copyToNext,updateRecord,setField,setModal,say,saveNow,saveState,unexported,setSession};

  return html`<div className="app">
    <${TopBar} ctx=${ctx}/>
    <main className="wrap">
      ${!db.noticeDismissed && html`<div className="notice apricot" style=${{marginBottom:'16px'}}>
        <${Icon} n="info"/>
        <div style=${{flex:1}}><b>사용 전 확인해 주세요.</b> 자료는 이 기기의 이 브라우저에만 임시 저장됩니다. 교사 선택은 자료를 나눠 보는 기능일 뿐 로그인이나 접근 통제가 아니며, 다른 교사와 실시간으로 공유되지 않습니다. 실제 영유아 개인정보는 기관의 개인정보 처리 기준과 보호자 동의 여부를 확인한 뒤 입력해 주세요. 처음 보이는 <span className="tag-sample">예시</span> 자료는 사용 방법을 보여 주기 위한 가상의 자료입니다.</div>
        <button className="btn sm" onClick=${()=>setDb(d=>({...d,noticeDismissed:true}))}>확인했어요</button>
      </div>`}
      ${view==='dash' && html`<${Dashboard} ctx=${ctx}/>`}
      ${view==='children' && html`<${ChildrenView} ctx=${ctx}/>`}
      ${view==='write' && html`<${WriteView} ctx=${ctx}/>`}
      ${view==='analysis' && html`<${AnalysisView} ctx=${ctx}/>`}
      ${view==='report' && html`<${ReportView} ctx=${ctx}/>`}
      ${view==='guide' && html`<${GuideView} ctx=${ctx}/>`}
      ${view==='after' && html`<${AfterView} ctx=${ctx}/>`}
      ${view==='save' && html`<${SaveView} ctx=${ctx}/>`}
    </main>
    <${Modal} m=${modal} close=${()=>setModal(null)}/>
    ${toast && html`<div className="toast" role="status">${toast}</div>`}
  </div>`;
}

function TopBar({ctx}){
  const {db,view,setView,setSession,saveState,unexported,setModal}=ctx;
  const years=[...new Set([defaultTerm().year-1,defaultTerm().year,defaultTerm().year+1,...db.records.map(r=>r.basic.year)])].sort();
  return html`<header className="topbar">
    <div className="wrap">
      <div className="brandrow">
        <div className="brand"><${Sprig} size=${38}/><div><h1>이음 상담ON</h1><div className="slogan">아이의 성장을 잇고, 가정과 마음을 잇다 · ${ORG}</div></div></div>
        <div className="ctxbar">
          <label htmlFor="sel-teacher">교사</label>
          <select id="sel-teacher" value=${db.session.teacherId||''} onChange=${e=>setSession({teacherId:e.target.value||null})}>
            <option value="">선택 안 함</option>
            ${db.teachers.map(t=>html`<option key=${t.id} value=${t.id}>${t.name} · ${t.className}</option>`)}
          </select>
          <button className="btn sm" onClick=${()=>setModal({title:'교사 및 담당 반',body:html`<${TeacherManager} ctx=${ctx}/>`,cancelLabel:'닫기'})}>관리</button>
          <label htmlFor="sel-year">학기</label>
          <select id="sel-year" value=${db.session.year} onChange=${e=>setSession({year:Number(e.target.value)})}>
            ${years.map(y=>html`<option key=${y} value=${y}>${y}학년도</option>`)}
          </select>
          <select id="sel-sem" aria-label="학기" value=${db.session.semester} onChange=${e=>setSession({semester:Number(e.target.value)})}>
            <option value=${1}>1학기</option><option value=${2}>2학기</option>
          </select>
          ${saveState.ok
            ? html`<span className="chip ok" title="이 브라우저에 자동으로 임시 저장됩니다"><${Icon} n="check" size=${13}/>${saveState.at?`임시 저장 ${fmtTime(saveState.at)}`:'임시 저장 대기'}</span>`
            : html`<span className="chip danger"><${Icon} n="alert" size=${13}/>브라우저 저장 실패</span>`}
          ${unexported>0 && html`<button className="chip warn" style=${{border:0,cursor:'pointer'}} onClick=${()=>setView('save')} title="JSON 파일로 백업하지 않은 자료가 있어요"><${Icon} n="download" size=${13}/>파일 백업 필요 ${unexported}</button>`}
        </div>
      </div>
      <nav className="tabs" aria-label="주 메뉴">
        ${MENUS.map(m=>html`<button key=${m.key} className="tab" aria-current=${view===m.key?'page':undefined} onClick=${()=>{ setView(m.key); window.scrollTo({top:0}); }}><${Icon} n=${m.icon} size=${15}/>${m.label}${m.soon && html`<span className="soon">${m.soon}</span>`}</button>`)}
      </nav>
    </div>
  </header>`;
}

function TeacherManager({ctx}){
  const {db,setDb,say}=ctx;
  const [name,setName]=useState(''); const [cls,setCls]=useState('');
  const add=()=>{ if(!name.trim()){ say('교사 이름을 입력해 주세요.'); return; } const t={id:uid('t'),name:name.trim(),className:cls.trim()||'반 미지정'}; setDb(d=>({...d,teachers:[...d.teachers,t],session:{...d.session,teacherId:t.id}})); setName(''); setCls(''); say(`${t.name} 선생님을 추가했어요.`); };
  return html`<div style=${{display:'grid',gap:'12px'}}>
    <p className="muted">교사별로 자료를 나눠 보기 위한 목록입니다. 비밀번호나 로그인 기능이 아니므로 같은 브라우저를 쓰는 사람은 모든 자료를 볼 수 있습니다.</p>
    <ul className="checklist">${db.teachers.length? db.teachers.map(t=>html`<li key=${t.id}><span className="avatar">${t.name.slice(0,1)}</span><div style=${{flex:1}}><b>${t.name}</b> <span className="muted">· ${t.className}</span><div className="muted small">작성 자료 ${db.records.filter(r=>r.teacherId===t.id).length}건</div></div>
      <button className="btn sm danger" onClick=${()=>{ setDb(d=>({...d,teachers:d.teachers.filter(x=>x.id!==t.id),session:{...d.session,teacherId:d.session.teacherId===t.id?null:d.session.teacherId}})); say('목록에서 뺐어요. 작성한 자료는 그대로 남아 있어요.'); }}>목록에서 빼기</button></li>`) : html`<li className="muted">등록된 교사가 없어요.</li>`}</ul>
    <div className="grid2">
      <${Field} id="tm-name" type="text" label="교사 이름" value=${name} onChange=${setName}/>
      <${Field} id="tm-class" type="text" label="담당 반" value=${cls} onChange=${setCls} placeholder="예: 새싹반(만 1세)"/>
    </div>
    <div><button className="btn primary" onClick=${add}><${Icon} n="plus"/>교사 추가</button></div>
  </div>`;
}

/* ───────── 전체 현황 ───────── */
function termRecords(db){
  return db.records.filter(r=>r.basic.year===db.session.year && r.basic.semester===db.session.semester && (!db.session.onlyMine || !db.session.teacherId || r.teacherId===db.session.teacherId));
}
function Dashboard({ctx}){
  const {db,newRecord,openRecord,setSession}=ctx;
  const list=termRecords(db).slice().sort((a,b)=>(a.basic.date||'9999').localeCompare(b.basic.date||'9999'));
  const count=s=>list.filter(r=>r.status===s).length;
  const me=db.teachers.find(t=>t.id===db.session.teacherId);
  const upcoming=list.filter(r=>r.status!=='counseled' && r.basic.date && r.basic.date>=todayStr()).slice(0,3);
  return html`<div>
    <div className="pagehead">
      <div className="grow"><h2>${termLabel(db.session.year,db.session.semester)} 상담 현황</h2><p>${me?`${me.name} 선생님 · ${me.className}`:'교사를 선택하면 내 자료만 모아 볼 수 있어요.'}</p></div>
      ${me && html`<label className="row small" style=${{gap:'6px'}}><input type="checkbox" id="only-mine" checked=${!!db.session.onlyMine} onChange=${e=>setSession({onlyMine:e.target.checked})} style=${{accentColor:'var(--sage-deep)'}}/>내 자료만 보기</label>`}
      <button className="btn primary" onClick=${newRecord}><${Icon} n="plus"/>새 영유아 등록</button>
    </div>
    <div className="stats">
      <div className="stat"><span className="k">상담 대상 영유아</span><span className="v">${list.length}<small>명</small></span></div>
      <div className="stat"><span className="k"><i className="dot" style=${{background:'var(--apricot)'}}></i>자료 작성 중</span><span className="v">${count('draft')}</span></div>
      <div className="stat"><span className="k"><i className="dot" style=${{background:'var(--muted)'}}></i>자료 작성 완료</span><span className="v">${count('done')}</span></div>
      <div className="stat"><span className="k"><i className="dot" style=${{background:'var(--sage)'}}></i>교사 검토 완료</span><span className="v">${count('reviewed')}</span></div>
      <div className="stat"><span className="k"><i className="dot" style=${{background:'var(--sage-deep)'}}></i>상담 완료</span><span className="v">${count('counseled')}</span></div>
    </div>
    <details className="help" style=${{marginBottom:'16px'}}><summary>사용 순서 한눈에 보기</summary>
      <ol style=${{margin:'8px 0 0',paddingLeft:'20px',display:'grid',gap:'3px'}}>
        <li>이 주소를 Ctrl+D로 즐겨찾기에 추가해 두세요. 상단에서 교사와 학기를 고르고 영유아를 등록하거나 "자료 열기"를 눌러요.</li>
        <li>상담자료 작성에서 기본정보, 교사 관찰기록, 안전·건강, 부모님 질문을 입력해요. 모든 내용은 자동 임시 저장되고, Ctrl+S로도 저장돼요.</li>
        <li>마지막 "AI 정리" 단계에서 Claude용 요청문을 복사해 붙여넣거나, AI 없이 초안을 바로 만들어요.</li>
        <li>Claude의 답변을 붙여넣어 반영하면 리포트 편집·상담 가이드가 채워져요.</li>
        <li>문장을 고치고 "교사 검토·승인"을 체크한 뒤 인쇄(PDF 저장)해요.</li>
        <li>상담을 마치면 상담 후 기록에 실제 내용을 적고, 저장 및 출력에서 JSON 파일로 백업해요.</li>
      </ol></details>
    ${upcoming.length>0 && html`<div className="notice sage" style=${{marginBottom:'16px'}}><${Icon} n="leaf"/><div><b>다가오는 상담</b> · ${upcoming.map(r=>`${displayName(r)} ${fmtDate(r.basic.date)} ${r.basic.time||''}`).join(' / ')}</div></div>`}
    ${list.length ? html`<${RecordTable} ctx=${ctx} list=${list}/>` : html`<div className="card empty-state"><${Sprig} size=${56}/><h3>이 학기에 등록된 영유아가 없어요</h3><p>새 영유아를 등록하거나, 영유아 관리에서 이전 학기 자료를 다음 학기로 복사해 시작할 수 있어요.</p><button className="btn primary" onClick=${newRecord}><${Icon} n="plus"/>새 영유아 등록</button></div>`}
  </div>`;
}
function RecordTable({ctx,list,manage}){
  const {openRecord,deleteRecord,copyToNext,updateRecord}=ctx;
  return html`<div className="tablewrap"><table>
    <thead><tr><th>이름(가명)</th>${manage&&html`<th>학기</th>`}<th>반</th><th>월령</th><th>담당 교사</th><th>상담 예정일</th><th>방법</th><th>작성률</th><th>진행 상태</th><th></th></tr></thead>
    <tbody>${list.map(r=>{ const pct=overallProgress(r); const qNeed=r.questions.filter(q=>!has(q.a)).length; return html`<tr key=${r.id}>
      <td><div className="namecell"><span className="avatar">${(r.basic.name.replace('예시 ','')||'?').slice(0,1)}</span><span>${displayName(r)}</span>${r.sample&&html`<span className="tag-sample">예시</span>`}</div>${qNeed>0&&html`<div className="small" style=${{color:'var(--warn)',marginLeft:'38px'}}>질문 답변 준비 필요 ${qNeed}</div>`}</td>

      <td className="num">${ageText(r)}</td>

      <td className="num">${r.basic.date?`${fmtDate(r.basic.date)} ${r.basic.time||''}`:'—'}</td>
      <td>${r.basic.method||'—'}</td>
      <td className="num" style=${{minWidth:'92px'}}><div className="bar" title=${pct+'%'}><i style=${{width:pct+'%'}}></i></div><span className="small muted">${pct}%</span></td>
      <td><select aria-label="진행 상태" value=${r.status} onChange=${e=>updateRecord(r.id,x=>({...x,status:e.target.value}))} style=${{width:'auto',padding:'4px 6px',fontSize:'13px'}}>${STATUS.map(([k,l])=>html`<option key=${k} value=${k}>${l}</option>`)}</select></td>
      <td><div className="row" style=${{gap:'4px',flexWrap:'nowrap'}}>
        <button className="btn sm soft" onClick=${()=>openRecord(r.id)}>자료 열기</button>
        ${manage && html`<button className="btn sm" title="다음 학기 자료 만들기" onClick=${()=>copyToNext(r)}><${Icon} n="copy" size=${14}/>다음 학기</button>
        <button className="btn sm icon danger" title="삭제" aria-label="삭제" onClick=${()=>deleteRecord(r)}><${Icon} n="trash" size=${14}/></button>`}
      </div></td>
    </tr>`; })}</tbody>
  </table></div>`;
}

/* ───────── 영유아 관리 ───────── */
function ChildrenView({ctx}){
  const {db,newRecord,setDb,setModal,say}=ctx;
  const [scope,setScope]=useState('term');
  const [q,setQ]=useState('');
  let list = scope==='term'? termRecords(db) : db.records;
  if(q.trim()) list=list.filter(r=>(r.basic.name+r.basic.className+r.basic.teacher).includes(q.trim()));
  list=list.slice().sort((a,b)=> (b.basic.year*10+b.basic.semester)-(a.basic.year*10+a.basic.semester) || a.basic.name.localeCompare(b.basic.name,'ko'));
  const samples=db.records.filter(r=>r.sample).length;
  return html`<div>
    <div className="pagehead">
      <div className="grow"><h2>영유아 관리</h2><p>영유아별·학기별 상담자료를 관리합니다. 같은 아이의 다음 학기 자료는 "다음 학기" 버튼으로 이어서 만들 수 있어요.</p></div>
      <button className="btn primary" onClick=${newRecord}><${Icon} n="plus"/>새 영유아 등록</button>
    </div>
    <div className="row" style=${{marginBottom:'12px'}}>
      <div className="choice">
        <label><input type="radio" name="scope" checked=${scope==='term'} onChange=${()=>setScope('term')}/>${termLabel(db.session.year,db.session.semester)}</label>
        <label><input type="radio" name="scope" checked=${scope==='all'} onChange=${()=>setScope('all')}/>모든 학기</label>
      </div>
      <input type="text" id="child-search" placeholder="이름, 반, 교사로 찾기" value=${q} onChange=${e=>setQ(e.target.value)} style=${{maxWidth:'260px'}}/>

    </div>
    ${list.length? html`<${RecordTable} ctx=${ctx} list=${list} manage=${true}/>` : html`<div className="card empty-state"><h3>조건에 맞는 자료가 없어요</h3></div>`}
  </div>`;
}

/* ───────── 상담자료 작성 ───────── */
function WriteView({ctx}){
  const {db,cur,step,setStep,openRecord,newRecord}=ctx;
  if(!cur){
    const list=termRecords(db);
    return html`<div className="card empty-state"><${Sprig} size=${56}/><h3>작성할 영유아를 선택해 주세요</h3><p>목록에서 고르거나 새로 등록하면 입력 화면이 열립니다.</p>
      <div className="row" style=${{justifyContent:'center'}}>${list.map(r=>html`<button key=${r.id} className="btn soft" onClick=${()=>openRecord(r.id)}>${displayName(r)}</button>`)}<button className="btn primary" onClick=${newRecord}><${Icon} n="plus"/>새 영유아 등록</button></div></div>`;
  }
  const S=STEPS[step-1];
  const go=n=>{ setStep(n); window.scrollTo({top:0,behavior:'smooth'}); };
  return html`<div className="write">
    <nav className="steps" aria-label="입력 단계">
      <div className="who"><span className="muted small">${termLabel(cur.basic.year,cur.basic.semester)}</span><b>${displayName(cur)}</b>${cur.sample&&html`<span className="tag-sample">예시 자료</span>`}</div>
      ${STEPS.map(s=>{ const st=stepState(cur,s); return html`<button key=${s.n} className=${'stepbtn '+st.cls} aria-current=${step===s.n?'step':undefined} onClick=${()=>go(s.n)}>
        <span className="n">${st.cls==='full'? html`<${Icon} n="check" size=${13}/>` : s.n}</span>
        <span className="t">${s.title}<small>${st.label}</small></span></button>`; })}
    </nav>
    <section aria-labelledby="step-title" style=${{minWidth:0}}>
      <div className="stephead"><span className="big">STEP ${S.n}</span><div><h2 id="step-title">${S.title}</h2><p>${STEP_DESC[S.key]}</p></div></div>
      ${React.createElement(STEP_COMP[S.key],{ctx,rec:cur})}
      <div className="navbtns" style=${{marginTop:'20px'}}>
        <button className="btn" disabled=${step===1} onClick=${()=>go(step-1)}><${Icon} n="arrowL"/>이전 단계</button>
        ${step<STEPS.length? html`<button className="btn primary" onClick=${()=>go(step+1)}>다음: ${STEPS[step].title}<${Icon} n="arrowR"/></button>`
                : html`<button className="btn primary" onClick=${()=>ctx.setView('report')}>다음 → 리포트 미리보기·저장<${Icon} n="arrowR"/></button>`}
      </div>
    </section>
    <${SidePanel} ctx=${ctx} rec=${cur} go=${go}/>
  </div>`;
}
const STEP_DESC = {
  basic:'월령은 생년월일과 상담 예정일로 자동 계산됩니다.',
  survey:'부모님이 작성한 설문을 그대로 옮겨 적어 주세요. 질문은 STEP 7, 양육의 어려움은 STEP 9에 따로 입력합니다.',
  obs:'모든 항목은 선택 입력입니다. 관찰한 내용만 짧게 메모해 주세요. 비어 있는 항목은 자료에 만들어 넣지 않습니다.',
  growth:'이전 학기 자료가 없다면 현재 관찰 중심으로 작성합니다.',
  safety:'선택 입력입니다. 비워 두면 학부모용 성장 리포트에서 자동으로 생략됩니다.',
  focus:'상담 전에 꼭 전달하고 싶은 내용을 정리합니다.',
  ai:'입력한 내용으로 학부모용 리포트와 교사용 상담 가이드 초안을 만듭니다.',
  questions:'부모님이 설문에 적은 질문을 그대로 옮기고, 질문마다 답변과 전달 방식을 정해 주세요.',
  photos:'학부모용 성장 리포트에 들어갈 사진은 최대 2장입니다. 사진이 없으면 사진틀은 인쇄되지 않습니다.',
  concern:'입력 과정의 마지막 단계입니다. 부모님의 양육 고민과 교사의 지원 방향을 정리하고 부모교육자료 생성 여부를 정합니다.',
};

function SidePanel({ctx,rec,go}){
  const {updateRecord,saveNow,db,say}=ctx;
  const pct=overallProgress(rec);
  const hits=cautionHits(rec);
  const qNeed=rec.questions.filter(q=>!has(q.a)).length;
  const qNoMode=rec.questions.filter(q=>!q.mode).length;
  const inReport=rec.questions.filter(q=>q.mode==='report'||q.mode==='both').length;
  const safety=safetyFilled(rec);
  const edu=wantsEdu(rec);
  return html`<aside className="side" aria-label="작성 상태">
    <div className="card">
      <h4>작성 상태</h4>
      <div className="bar"><i style=${{width:pct+'%'}}></i></div>
      <p className="small muted" style=${{marginTop:'6px'}}>필수 단계 기준 ${pct}% 입력</p>
      <div className="field" style=${{marginTop:'10px'}}>
        <label htmlFor="side-status">진행 상태</label>
        <select id="side-status" value=${rec.status} onChange=${e=>updateRecord(rec.id,r=>({...r,status:e.target.value}))}>${STATUS.map(([k,l])=>html`<option key=${k} value=${k}>${l}</option>`)}</select>
      </div>
      <div className="row" style=${{marginTop:'12px'}}>
        <button className="btn primary sm" onClick=${()=>{ if(saveNow(db)) say('이 브라우저에 저장했어요.'); else say('브라우저 저장에 실패했어요. 저장 및 출력에서 JSON 파일로 내보내 주세요.'); }}><${Icon} n="save" size=${14}/>지금 저장</button>
        <button className="btn sm" onClick=${()=>ctx.setView('save')}><${Icon} n="download" size=${14}/>파일 백업</button>
      </div>
    </div>
    <div className="card">
      <h4>학부모용 리포트 구성 미리보기</h4>
      <ul className="plist">
        <li><span className="pg">1p</span><span>우리 아이 성장 이야기 · 대표 사진 ${rec.photos.main.src?'있음':html`<span className="muted">없음(사진틀 생략)</span>`}</span></li>
        <li><span className="pg">2p</span><span>함께 자라는 우리 아이 · 활동 사진 ${rec.photos.play.src?'있음':html`<span className="muted">없음</span>`}</span></li>
        <li><span className="pg">2p</span><span className=${safety?'':'off'}>안전하고 건강한 어린이집 생활을 위해</span>${!safety&&html`<span className="muted small">생략</span>`}</li>
        <li><span className="pg">2p</span><span>부모님 질문 리포트 반영 ${inReport}개</span></li>
        <li><span className="pg">3p</span><span className=${edu?'':'off'}>함께하는 부모교육</span>${!edu&&html`<span className="muted small">${rec.concern.generate==='no'?'생성 안 함':'미선택'}</span>`}</li>
      </ul>
      <div className="row" style=${{marginTop:'8px'}}><button className="btn sm soft" onClick=${()=>ctx.setView('analysis')}>Claude 요청문 만들기</button><button className="btn sm" onClick=${()=>ctx.setView('report')}>리포트 보기</button></div>
    </div>
    <div className="card">
      <h4>상담 전 확인</h4>
      <ul className="plist">
        <li>${rec.questions.length? (qNeed? html`<span className="chip warn">답변 준비 필요 ${qNeed}</span>` : html`<span className="chip ok">질문 ${rec.questions.length}개 답변 준비</span>`) : html`<span className="chip">등록된 부모님 질문 없음</span>`}</li>
        ${qNoMode>0 && html`<li><span className="chip warn">전달 방식 미선택 ${qNoMode}</span></li>`}
        ${rec.safety.important && html`<li><span className="chip danger">안전 관련 중요 관찰 있음</span></li>`}
        <li>${hits.length? html`<span className="chip apricot">다시 살펴볼 표현 ${hits.length}</span>` : html`<span className="chip ok">점검할 표현 없음</span>`}</li>
      </ul>
      ${hits.length>0 && html`<ul className="plist" style=${{marginTop:'8px'}}>${hits.slice(0,4).map((h,i)=>html`<li key=${i} className="small"><span><b>"${h.phrase}"</b> · ${h.where}<br/><span className="muted">${h.tip}</span></span></li>`)}</ul>`}
    </div>
  </aside>`;
}

/* STEP 1 */
function Step1({ctx,rec}){
  const {setField,db}=ctx; const b=rec.basic; const f=(k,v)=>setField(rec.id,['basic',k],v);
  const age=ageInfo(b.birth,b.date||null);
  const classes=[...new Set([...db.teachers.map(t=>t.className),...db.records.map(r=>r.basic.className)].filter(Boolean))];
  return html`<div className="card"><div className="grid2">
    <${Field} id="b-name" type="text" label="이름 또는 가명" value=${b.name} onChange=${v=>f('name',v)} placeholder="가명 사용을 권장해요"/>
    <${Field} id="b-birth" type="date" label="생년월일" value=${b.birth} onChange=${v=>f('birth',v)}/>
    <div className="field"><span className="lbl">월령 (자동 계산)</span><div className="computed">${age? `${age.months}개월 · 만 ${age.years}세` : '생년월일을 입력하면 계산됩니다'}</div><p className="hint" style=${{marginTop:0}}>${b.date?'상담 예정일 기준':'오늘 기준 (상담 예정일을 넣으면 그날 기준으로 바뀌어요)'}</p></div>
    <div className="field"><label htmlFor="b-class">반 이름</label><input id="b-class" type="text" list="class-list" className=${has(b.className)?'filled':''} value=${b.className} onChange=${e=>f('className',e.target.value)}/><datalist id="class-list">${classes.map(c=>html`<option key=${c} value=${c}/>`)}</datalist></div>
    <div className="field"><label htmlFor="b-teacher">담당 교사</label>
      <select id="b-teacher" value=${rec.teacherId||''} onChange=${e=>{ const t=db.teachers.find(x=>x.id===e.target.value); ctx.updateRecord(rec.id,r=>({...r,teacherId:t?t.id:null,basic:{...r.basic,teacher:t?t.name:r.basic.teacher,className:r.basic.className||(t?t.className:'')}})); }}>
        <option value="">${b.teacher&&!rec.teacherId? b.teacher+' (목록에 없음)':'선택'}</option>
        ${db.teachers.map(t=>html`<option key=${t.id} value=${t.id}>${t.name} · ${t.className}</option>`)}
      </select><p className="hint" style=${{marginTop:0}}>목록은 상단 "교사 관리"에서 추가할 수 있어요.</p></div>
    <div className="field"><span className="lbl">학년도 및 학기</span><div className="row" style=${{flexWrap:'nowrap'}}>
      <input id="b-year" type="number" min="2020" max="2100" value=${b.year} onChange=${e=>f('year',Number(e.target.value)||b.year)} aria-label="학년도"/>
      <select id="b-sem" value=${b.semester} onChange=${e=>f('semester',Number(e.target.value))} aria-label="학기"><option value=${1}>1학기</option><option value=${2}>2학기</option></select></div></div>
    <${Field} id="b-date" type="date" label="상담 예정일" value=${b.date} onChange=${v=>f('date',v)}/>
    <${Field} id="b-time" type="time" label="상담 시간" value=${b.time} onChange=${v=>f('time',v)}/>
    <div className="field span2"><span className="lbl">상담 방법</span><div className="choice">${['전화','방문'].map(m=>html`<label key=${m}><input type="radio" name="b-method" checked=${b.method===m} onChange=${()=>f('method',m)}/>${m}</label>`)}</div></div>
  </div></div>`;
}

/* STEP 2 */
function Step2({ctx,rec}){
  const {setField}=ctx;
  return html`<div className="stack">
    <div className="notice"><${Icon} n="info"/><div>부모님 표현을 최대한 그대로 옮겨 주세요. 설문에 없는 내용은 비워 두면 됩니다.</div></div>
    <div className="card"><div className="grid2">
      ${SURVEY.map(([k,l],i)=>html`<${Field} key=${k} id=${'s-'+k} num=${i+1} label=${l} value=${rec.survey[k]} onChange=${v=>setField(rec.id,['survey',k],v)}/>`)}
    </div></div>

}

/* STEP 3 */
function WritingHelp(){
  return html`<details className="help"><summary>관찰 메모 작성 도움말</summary>
    <div className="cols">
      <div><b>피해야 할 표현</b><ul className="no"><li>문제가 많아요.</li><li>고집이 세요.</li><li>친구들과 잘 어울리지 못해요.</li><li>집중력이 없어요.</li><li>집에서도 잘 지도해 주세요.</li></ul></div>
      <div><b>권장하는 표현</b><ul className="yes"><li>원하는 활동을 계속하고 싶을 때 울음이나 몸짓으로 자신의 마음을 표현해요.</li><li>친구의 놀이를 먼저 관찰한 뒤 관심 있는 놀잇감에 가까이 다가가요.</li><li>관심 있는 활동은 반복 탐색하며, 새 활동으로 전환할 때 교사의 안내가 필요할 때가 있어요.</li></ul></div>
    </div>
    <p className="muted small" style=${{marginTop:'8px'}}>관찰한 사실(언제, 어디서, 무엇을)과 교사의 해석은 나누어 적어 주세요. 성격 단정, 다른 아이와의 비교, 원인 추측, 발달 진단은 피합니다.</p>
  </details>`;
}
function Step3({ctx,rec}){
  const [allOpen,setAllOpen]=useState(null);
  const {setField,updateRecord}=ctx;
  const addEp=dk=>updateRecord(rec.id,r=>setIn(r,['obs','_ep',dk],[...(r.obs._ep[dk]||[]),{id:uid('ep'),date:todayStr(),situation:'',behavior:'',support:'',response:''}]));
  const delEp=(dk,id)=>updateRecord(rec.id,r=>setIn(r,['obs','_ep',dk],r.obs._ep[dk].filter(e=>e.id!==id)));
  const setEp=(dk,i,k,v)=>setField(rec.id,['obs','_ep',dk,i,k],v);
  return html`<div className="stack">
    <${WritingHelp}/>
    <div className="row"><button className="btn sm" onClick=${()=>setAllOpen(true)}>모든 영역 펼치기</button><button className="btn sm" onClick=${()=>setAllOpen(false)}>모든 영역 접기</button></div>
    <div>${OBS.map((d,di)=>{ const filled=d.items.filter(([k])=>has(rec.obs[d.key][k])).length; const eps=rec.obs._ep[d.key]||[];
      return html`<details key=${d.key+'-'+allOpen} className="domain" open=${allOpen===null ? (di===0||filled>0) : allOpen}>
        <summary><span className="mark">${'①②③④⑤⑥⑦'[di]}</span><h3>${d.title}</h3><span className=${'chip '+(filled?'ok':'')}>${filled}/${d.items.length}${eps.length?` · 일화 ${eps.length}`:''}</span><span className="chev"><${Icon} n="chev"/></span></summary>
        <div className="body">
          <div className="grid2">${d.items.map(([k,l])=>html`<${Field} key=${k} id=${`o-${d.key}-${k}`} label=${l} value=${rec.obs[d.key][k]} onChange=${v=>setField(rec.id,['obs',d.key,k],v)} placeholder="관찰한 내용이 있을 때만 적어 주세요"/>`)}</div>
          ${eps.map((e,i)=>html`<div key=${e.id} className="episode">
            <div className="eh"><b className="small">관찰 일화 ${i+1}</b><input type="date" id=${`ep-${e.id}-date`} value=${e.date} onChange=${ev=>setEp(d.key,i,'date',ev.target.value)} style=${{width:'auto',padding:'4px 8px'}} aria-label="관찰 날짜"/><button className="btn sm icon danger" style=${{marginLeft:'auto'}} aria-label="일화 삭제" onClick=${()=>delEp(d.key,e.id)}><${Icon} n="trash" size=${14}/></button></div>
            <div className="grid2">
              <${Field} id=${`ep-${e.id}-s`} label="상황" value=${e.situation} onChange=${v=>setEp(d.key,i,'situation',v)}/>
              <${Field} id=${`ep-${e.id}-b`} label="행동" value=${e.behavior} onChange=${v=>setEp(d.key,i,'behavior',v)}/>
              <${Field} id=${`ep-${e.id}-t`} label="교사 지원" value=${e.support} onChange=${v=>setEp(d.key,i,'support',v)}/>
              <${Field} id=${`ep-${e.id}-r`} label="이후 반응" value=${e.response} onChange=${v=>setEp(d.key,i,'response',v)}/>
            </div></div>`)}
          <div><button className="btn sm soft" onClick=${()=>addEp(d.key)}><${Icon} n="plus" size=${14}/>관찰 일화 추가 (날짜·상황·행동·지원·반응)</button></div>
        </div></details>`; })}</div>
  </div>`;
}

/* STEP 4 */
function Step4({ctx,rec}){
  const {setField,db}=ctx;
  const prev=rec.prevId? db.records.find(r=>r.id===rec.prevId) : db.records.filter(r=>r.childKey===rec.childKey && r.id!==rec.id && (r.basic.year*10+r.basic.semester)<(rec.basic.year*10+rec.basic.semester)).sort((a,b)=>(b.basic.year*10+b.basic.semester)-(a.basic.year*10+a.basic.semester))[0];
  return html`<div className="stack">
    ${prev? html`<div className="notice sage"><${Icon} n="leaf"/><div style=${{flex:1}}><b>${termLabel(prev.basic.year,prev.basic.semester)} 기록이 있어요.</b>
        <dl className="kv" style=${{marginTop:'6px'}}><dt>현재 모습</dt><dd>${prev.growth.now||'—'}</dd><dt>성장한 부분</dt><dd>${prev.growth.grown||'—'}</dd><dt>지원하고 싶은 부분</dt><dd>${prev.growth.support||'—'}</dd></dl></div>
        <button className="btn sm" onClick=${()=>setField(rec.id,['growth','prev'],[rec.growth.prev,prev.growth.now].filter(has).join('\n'))} disabled=${!has(prev.growth.now)}>지난 학기 모습에 넣기</button></div>`
      : html`<div className="notice"><${Icon} n="info"/><div>이전 학기 자료가 없어요. 현재 관찰 중심으로 작성해 주세요. 지난 학기 자료가 있다면 영유아 관리에서 "다음 학기" 버튼으로 이어서 만들면 여기에서 참고할 수 있어요.</div></div>`}
    <div className="card"><div className="grid2">${GROWTH.map(([k,l,h])=>html`<${Field} key=${k} id=${'g-'+k} label=${l} hint=${h} value=${rec.growth[k]} onChange=${v=>setField(rec.id,['growth',k],v)} rows=${3}/>`)}</div></div>
  </div>`;
}

/* STEP 5 */
function Step5({ctx,rec}){
  const {setField,updateRecord}=ctx; const s=rec.safety;
  const toggle=a=>updateRecord(rec.id,r=>setIn(r,['safety','areas'], r.safety.areas.includes(a)? r.safety.areas.filter(x=>x!==a) : [...r.safety.areas,a]));

function PhotoFrame({p,label}){
  const ratio = p.ratio==='orig' ? (p.w&&p.h? `${p.w} / ${p.h}` : '4 / 3') : p.ratio.replace(':',' / ');
  if(!p.src) return html`<div className="frame empty" style=${{aspectRatio:'4 / 3'}}><div><${Icon} n="photo" size=${28}/><div>${label} 없음</div><div className="small">리포트에 사진틀이 인쇄되지 않아요</div></div></div>`;
  const z=p.zoom/100;
  return html`<div className="frame" style=${{aspectRatio:ratio, maxHeight:'420px'}}>
    <img src=${p.src} alt=${p.caption||label} style=${{objectFit:p.fit, objectPosition:`${p.x}% ${p.y}%`, transform:`scale(${z})`, transformOrigin:`${p.x}% ${p.y}%`, background:'var(--surface-2)'}}/>
  </div>`;
}
function PhotoSlot({ctx,rec,slot,label,desc}){

    const file=e.target.files&&e.target.files[0]; e.target.value='';

    ${notStored && html`<div className="notice warn small"><${Icon} n="alert"/><div>브라우저 저장 공간이 부족해 이 사진은 임시 저장되지 않았어요. "사진 포함"으로 JSON 파일을 내보내 두세요.</div></div>`}
    <input ref=${inp} type="file" accept="image/jpeg,image/png" hidden onChange=${onFile} id=${'file-'+slot}/>
    <div className="row">
      <button className="btn sm primary" onClick=${()=>inp.current.click()}><${Icon} n="upload" size=${14}/>${p.src?'사진 변경':'사진 첨부'}</button>
      ${p.src && html`<button className="btn sm danger" onClick=${()=>updateRecord(rec.id,x=>setIn(x,['photos',slot],{...emptyPhoto()}))}><${Icon} n="trash" size=${14}/>삭제</button>`}
    </div>
    ${p.src && html`<div style=${{display:'grid',gap:'10px'}}>
      <div className="field"><span className="lbl">표시 방식</span><div className="choice">
        <label><input type="radio" name=${'fit-'+slot} checked=${p.fit==='contain'} onChange=${()=>set('fit','contain')}/>사진 전체 보이기</label>
        <label><input type="radio" name=${'fit-'+slot} checked=${p.fit==='cover'} onChange=${()=>set('fit','cover')}/>틀에 꽉 채우기</label></div>
        ${p.fit==='cover' && html`<p className="hint" style=${{marginTop:'2px',color:'var(--warn)'}}>가장자리가 잘릴 수 있어요. 얼굴이나 몸이 잘리지 않았는지 확인하고 위치를 조절해 주세요.</p>`}</div>
      <div className="field"><span className="lbl">사진틀 비율</span><div className="choice">${[['orig','원본 비율'],['4:3','가로 4:3'],['3:4','세로 3:4'],['1:1','정사각형']].map(([k,l])=>html`<label key=${k}><input type="radio" name=${'ratio-'+slot} checked=${p.ratio===k} onChange=${()=>set('ratio',k)}/>${l}</label>`)}</div></div>

    </div>`}

const STEP_COMP={ai:StepAI,basic:Step1,survey:Step2,obs:Step3,growth:Step4,safety:Step5,focus:Step6,questions:Step7,photos:Step8,concern:Step9};

function StepAI({ctx, rec}) {
  const [open, setOpen] = useState(false);
  const [sample, setSample] = useState(null), [busy, setBusy] = useState(false), [err, setErr] = useState('');
  useEffect(() => {
    let on = true;
    try { const p = window.claude && window.claude.use && window.claude.use('sample'); if (p && p.then) p.then(x => { if (on && x) setSample(() => x); }).catch(() => {}); } catch (e) { /* Claude 안에서 열었을 때만 사용 */ }
    return () => { on = false; };
  }, []);
  const runSample = async () => {
    setBusy(true); setErr('');
    try {
      const r = await sample(buildPrompt(rec), {modelTier: 'default', cache: false});
      if (r.truncated) throw new Error('답변이 중간에 끊겼어요. 다시 시도하거나 복사·붙여넣기 방식을 써 주세요.');
      const p = extractJSON(r.text);
      if (!p.ok) throw new Error(p.error);
      if (!p.data.report && !p.data.guide) throw new Error('결과 형식이 달라요. 다시 시도해 주세요.');
      const result = normalizeAI(p.data);
      ctx.updateRecord(rec.id, x => ({...x, ai: {...x.ai, raw: r.text, result, appliedAt: nowISO(), approved: {...x.ai.approved, report: false, guide: false}}}));
      ctx.say('Claude가 작성했어요. 문장을 확인하고 고쳐 주세요.'); ctx.setView('report');
    } catch (e) { setErr((e && e.message) || 'Claude 호출에 실패했어요. 복사·붙여넣기 방식을 써 주세요.'); }
    setBusy(false);
  };
  const res = rec.ai.result; const nm = has(rec.basic.name) ? rec.basic.name : '우리 아이';
  return html`<div className="stack">
    <div className="notice sage"><${Icon} n="leaf"/><div>지금까지 입력한 관찰기록, 안전·건강 내용, 부모님 질문을 모아 학부모용 리포트와 교사용 상담 가이드 초안을 만들어요. 만든 뒤에는 자유롭게 고칠 수 있어요.</div></div>
    ${res && html`<div className="notice"><${Icon} n="check"/><div style=${{flex:1}}>이미 초안이 만들어져 있어요. (${fmtDateTime(rec.ai.appliedAt)}) 다시 만들면 직접 고친 내용이 바뀌니 주의해 주세요.</div><button className="btn sm primary" onClick=${() => ctx.setView('report')}>리포트 보기</button></div>`}
    <div className="card" style=${{display:'grid',justifyItems:'center',gap:'10px',padding:'28px 16px',textAlign:'center'}}>
      ${sample && html`<button className="btn primary big" disabled=${busy} onClick=${runSample}>${busy ? 'Claude가 작성하는 중이에요…(1~2분)' : html`<${Icon} n="leaf"/>Claude로 자동 작성하기`}</button>${err && html`<div className="notice warn" style=${{textAlign:'left'}}><${Icon} n="alert"/><div>${err}</div></div>`}<p className="muted small">입력한 내용을 바탕으로 Claude가 문장을 꾸며 줘요. 이 화면에서 바로 작성됩니다.</p>`}
      <button className=${'btn big' + (sample ? '' : ' primary')} onClick=${() => setOpen(!open)}>무료로 ${nm}의 상담자료 만들기 (Claude)</button>
      <p className="muted small">Claude.ai(무료)에 붙여넣을 내용을 만들어 드려요. 답을 받아서 다시 붙여넣으면 적용돼요.</p>
      <button className="btn big" onClick=${() => applyDraft(ctx, rec)}>AI 없이, 내가 적은 내용으로만 초안 만들기</button>
      ${!sample && html`<p className="muted small" style=${{maxWidth:'520px'}}>이 사이트에는 AI가 연결되어 있지 않아요. 문장을 꾸미려면 위 버튼으로 만든 요청문을 Claude(claude.ai)에 붙여넣고 답을 받아 오세요. Claude 안에서 열면 "자동 작성하기" 버튼이 나타나요.</p>`}
    </div>
    ${open && html`<${AIPanel} key=${rec.id} ctx=${ctx} rec=${rec} noDraft=${true}/>`}
  </div>`;
}

/* ───────── 자료 분석 (1차: 입력 점검) ───────── */
function AnalysisView({ctx}){

  const hits=cautionHits(cur);
  const qs=cur.questions;
  const obsCount=stepProgress(cur,'obs');
  const items=[
    ['아이의 성장 사례가 구체적인가?', obsCount.extra>0 || has(cur.growth.grown) ? 'y' : 'n', obsCount.extra>0? `관찰 일화 ${obsCount.extra}개, 성장 기록 ${has(cur.growth.grown)?'있음':'없음'}` : '관찰 일화(날짜·상황·행동)를 1개 이상 추가하면 사례가 구체적이 됩니다.', 2],
    ['부모님 질문이 모두 확인되었는가?', !qs.length? 'q' : qs.every(q=>has(q.a))?'y':'n', !qs.length? '등록된 질문이 없어요. 부모님 질문이 없었는지 확인해 주세요.' : `${qs.length}개 중 답변 준비 ${qs.filter(q=>has(q.a)).length}개`, 4],
    ['질문별 답변 전달 방식이 설정되었는가?', !qs.length?'q': qs.every(q=>q.mode)?'y':'n', !qs.length? '—' : `전달 방식 미선택 ${qs.filter(q=>!q.mode).length}개`, 4],
    ['관찰 사실과 해석이 구분되어 있는가?', 'q', '교사가 직접 확인해 주세요. 일화 기록의 "행동"에는 본 그대로만 적습니다.', 2],
    ['부정적이거나 단정적인 표현은 없는가?', hits.length?'n':'y', hits.length? hits.slice(0,3).map(h=>`"${h.phrase}"(${h.where})`).join(', ') : '자동 점검에서 걸린 표현이 없어요. 최종 확인은 교사가 해 주세요.', null],
    ['안전 관련 중요한 관찰이 누락되지 않았는가?', 'q', safetyFilled(cur)? `안전·건강 영역 입력됨${cur.safety.important?' · 중요 표시됨':''}` : '안전·건강 영역이 비어 있어요. 기록할 관찰이 없는지 확인해 주세요.', 3],
  ];
  return html`<div className="stack">
    <div className="pagehead"><div className="grow"><h2>자료 분석 · ${displayName(cur)}</h2><p>입력 내용을 점검하고, Claude에 붙여넣을 작성 요청문을 만든 뒤 결과를 다시 붙여넣어 리포트와 가이드에 반영합니다.</p></div></div>
    <div className="card"><h3>상담자료 점검</h3><ul className="checklist">${items.map(([t,s,d,st],i)=>html`<li key=${i}><span className=${'ic '+s}><${Icon} n=${s==='y'?'check':s==='n'?'alert':'info'} size=${13}/></span><div style=${{flex:1}}><b>${t}</b><div className="small muted">${d}</div></div>${st&&html`<button className="btn sm" onClick=${()=>openRecord(cur.id,st)}>STEP ${st}로</button>`}</li>`)}</ul>
      <p className="small muted" style=${{marginTop:'10px'}}>초록 표시는 입력 여부를 기준으로 한 자동 점검이며, 문장의 적절성은 교사가 최종 판단합니다.</p></div>
    <div className="card"><h3>부모님 질문 준비 현황</h3>${qs.length? html`<div className="tablewrap"><table style=${{minWidth:'560px'}}><thead><tr><th>#</th><th>부모님 질문</th><th>답변</th><th>전달 방식</th></tr></thead><tbody>${qs.map((q,i)=>html`<tr key=${q.id}><td className="num">${i+1}</td><td>${q.q||'—'}</td><td>${has(q.a)? q.a : html`<span className="chip warn">답변 준비 필요</span>`}</td><td>${q.mode? Q_MODES.find(m=>m[0]===q.mode)[1] : html`<span className="chip warn">미선택</span>`}</td></tr>`)}</tbody></table></div>` : html`<p className="muted">등록된 질문이 없어요.</p>`}</div>
    <${AIPanel} key=${cur.id} ctx=${ctx} rec=${cur}/>
  </div>`;
}

function buildPrompt(rec) {
  const L = [];
  const sec = (title, fn) => {
    const s = [];
    fn((label, val) => { if (has(val)) s.push(`- ${label}: ${String(val).trim().replace(/\n+/g, ' / ')}`); }, s);
    if (s.length) L.push('', '## ' + title, ...s);
  };
  const b = rec.basic, a = ageInfo(b.birth, b.date || null);
  sec('영유아 기본정보', ad => { ad('이름(가명)', b.name); ad('월령', a ? a.months + '개월' : ''); ad('반', b.className); ad('담당 교사', b.teacher); ad('학기', termLabel(b.year, b.semester)); ad('기관', ORG); ad('상담 방법', b.method); });
  sec('학부모 사전 설문지', ad => SURVEY.forEach(([k, l]) => ad(l, rec.survey[k])));
  sec('교사 관찰기록', (ad, s) => OBS.forEach(d => {
    d.items.forEach(([k, l]) => ad(`${d.title} · ${l}`, rec.obs[d.key][k]));
    (rec.obs._ep[d.key] || []).forEach(e => { const t = [e.date && `날짜 ${e.date}`, e.situation && `상황 ${e.situation}`, e.behavior && `행동 ${e.behavior}`, e.support && `교사 지원 ${e.support}`, e.response && `이후 반응 ${e.response}`].filter(Boolean).join(' / '); ad(`${d.title} · 관찰 일화`, t); });
  }));
  sec('지난 학기 대비 성장', ad => GROWTH.forEach(([k, l]) => ad(l, rec.growth[k])));
  sec('안전하고 건강한 어린이집 생활을 위해', ad => {
    ad('관찰 영역', [...rec.safety.areas.filter(x => x !== '기타'), rec.safety.areas.includes('기타') ? ('기타' + (rec.safety.areaEtc ? `(${rec.safety.areaEtc})` : '')) : ''].filter(Boolean).join(', '));
    SAFETY_Q.forEach(([k, l]) => ad(l, rec.safety[k]));
    if (safetyFilled(rec)) ad('교사가 안전 관련 중요 관찰로 표시', rec.safety.important ? '예' : '아니오');
  });
  sec('상담 핵심 주제', ad => FOCUS.forEach(([k, l]) => ad(l, rec.focus[k])));
  const qs = rec.questions.filter(q => has(q.q));
  if (qs.length) {
    L.push('', '## 부모님 질문 (모든 질문이 교사용 상담 가이드에 들어갑니다)');
    qs.forEach(q => L.push(`- [id: ${q.id}] 질문: ${q.q.trim().replace(/\n+/g, ' / ')} | 교사 답변: ${has(q.a) ? q.a.trim().replace(/\n+/g, ' / ') : '(답변 미작성 - 답변을 지어내지 말 것)'} | 전달 방식: ${q.mode ? Q_MODES.find(m => m[0] === q.mode)[1] : '미선택'}`));
  }
  sec('양육의 어려움과 부모교육자료', ad => {
    const c = rec.concern;
    ad('부모님이 느끼는 양육의 어려움', c.text);
    ad('관련 양육 주제', [...c.topics, c.topicEtc].filter(Boolean).join(', '));
    CONCERN_Q.forEach(([k, l]) => ad(l, c[k]));
  });
  const photoCaps = ['main', 'play'].map(s => rec.photos[s]).filter(p => p.src && has(p.caption)).map(p => p.caption);

  const genEdu = wantsEdu(rec);

    '"문제행동", "고집이 세다", "잘 어울리지 못한다", "집중력이 없다", "집에서도 잘 지도해 주세요" 같은 표현은 쓰지 마세요.',

  ].forEach((t, i) => out.push(`${i + 1}. ${t}`));

  out.push('- 학부모용 성장 리포트는 A4 2페이지 분량입니다. 어린이집에서의 하루는 3~5문장, story는 문단 2~3개, strengths는 2~3개, domains는 입력이 있는 영역만 3~5개로 간결하게 쓰세요.');
  out.push('- 부모교육자료는 A4 한 페이지 분량이며 tips는 3~5개입니다.');
  out.push('', '# 이번 자료의 개별 지시');
  out.push(safetyFilled(rec)
    ? '- 안전·건강 영역이 입력되어 있습니다. report.safety와 guide.safety를 반드시 작성하고, 입력된 행동·빈도·지원 내용을 축소하거나 누락하지 마세요.'

/* Claude 없이: 입력한 메모를 그대로 정리한 초안 (없는 내용은 만들지 않음) */
function draftFromInput(rec) {
  const STEM = {'하': '해요', '되': '돼요', '보': '봐요', '가': '가요', '오': '와요', '주': '줘요', '자': '자요', '리': '려요'};
  const soft = p => { p = p.trim(); if (!p || /[다요죠까]$/.test(p)) return p; const c = p.charCodeAt(p.length - 1) - 0xAC00; if (c < 0 || c > 11171 || c % 28 !== 16) return p; const stem = String.fromCharCode(0xAC00 + c - 16); if (STEM[stem]) return p.slice(0, -1) + STEM[stem]; if (stem === '으' && p.length > 1) { const q = p.charCodeAt(p.length - 2) - 0xAC00; if (q >= 0 && q <= 11171) { const v = Math.floor((q % 588) / 28), jong = q % 28; return p.slice(0, -1) + ((jong !== 20 && [0, 2, 8].includes(v)) ? '아요' : '어요'); } } return p; };
  const sn = t => { t = String(t || '').trim().replace(/\s*\n+\s*/g, ' '); if (!t) return ''; const parts = t.split(/(?<=[.!?])\s*/).filter(Boolean).map(p => { const e = (p.match(/[.!?]+$/) || ['.'])[0]; return soft(p.replace(/[.!?]+$/, '')) + e; }); return parts.join(' '); };
  const join = arr => arr.map(sn).filter(Boolean).join(' ');
  const o = rec.obs, g = rec.growth, f = rec.focus, sf = rec.safety, c = rec.concern;
  const all = OBS.flatMap(d => d.items.map(([k, l]) => ({dk: d.key, l, t: o[d.key][k]}))).filter(x => has(x.t));
  const eps = OBS.flatMap(d => (o._ep[d.key] || []).map(e => [e.situation, e.behavior, e.support, e.response].filter(has).join(' '))).filter(has);
  const dayItems = all.filter(x => x.dk === 'habit' || x.dk === 'play' || (x.dk === 'social' && x.l.includes('교사')));
  const day = join((dayItems.length ? dayItems : all.slice(0, 3)).map(x => x.t));
  let story = [g.grown, g.newChange, g.now, f.biggest].map(sn).filter(Boolean);
  if (!story.length) story = eps.slice(0, 3).map(sn);
  if (!story.length) story = all.filter(x => x.dk !== 'habit' && x.dk !== 'play').slice(0, 3).map(x => sn(x.t));
  const strPool = all.filter(x => x.dk === 'play' || x.l.includes('또래') || x.l.includes('호기심') || x.l.includes('반복'));
  const strengths = (has(f.mustTell) ? [{title: '이런 모습이 빛나요', text: sn(f.mustTell)}] : []).concat((strPool.length ? strPool : all.filter(x => x.dk !== 'habit')).slice(0, 3).map(x => ({title: x.l, text: sn(x.t)}))).slice(0, 3);
  const domains = OBS.map(d => ({name: d.title, text: join(d.items.map(([k]) => o[d.key][k]).concat((o._ep[d.key] || []).map(e => e.behavior)))})).filter(d => has(d.text));
  const safety = safetyFilled(rec) ? join([sf.situation, sf.behavior, sf.frequency, sf.support, sf.response, sf.home]) : '';
  const home = join([c.home, sf.home, f.together]);
  const edu = wantsEdu(rec) ? {title: c.topics[0] || '', understand: '', tips: (c.home + '\n' + c.suggest).split('\n').map(x => x.trim()).filter(Boolean), phrases: [], together: [c.suggest].filter(has)} : null;
  const guide = {topics: FOCUS.map(([k, l]) => ({title: l, text: f[k]})).filter(t => has(t.text)).slice(0, 3)};
  return {report: {day, story, strengths, domains, safety, qa: [], home, closing: ''}, edu, guide};
}

function isTemplate(d) { const r = (d && d.report) || {}; const sx = v => typeof v === 'string' ? v : Array.isArray(v) ? sx(v[0]) : ''; return sx(r.day).startsWith('어린이집에서의 하루: 등원 모습') || sx(r.story).includes('실제 관찰 사례 중심 문단') || sx(r.closing).startsWith('교사의 따뜻한 마무리 글'); }
function extractJSON(text) {
  const raw = String(text || '');
  const ECHO = '당신은 어린이집 학부모 상담자료를 정리하는';
  if (raw.includes(ECHO) && raw.includes('# 입력 자료') && !raw.split('# 입력 자료').pop().includes('"report"')) return {ok: false, error: '요청문이 그대로 붙여넣어졌어요. 이 칸에는 요청문이 아니라 AI(Claude, ChatGPT 등)가 보내 준 답변을 붙여넣어 주세요.'};
  let t = raw.replace(/```json/gi, '```');
  const blocks = [...t.matchAll(/```\s*([\s\S]*?)```/g)].map(m => m[1]).filter(b => b.includes('"report"') || b.includes('"guide"'));
  if (blocks.length) t = blocks[blocks.length - 1];
  const f = t.indexOf('{'), l = t.lastIndexOf('}');
  if (f < 0 || l <= f) return {ok: false, error: 'JSON({ })를 찾지 못했어요. Claude의 답변 전체를 그대로 붙여넣었는지 확인해 주세요.'};
  t = t.slice(f, l + 1);
  const tries = [t, t.replace(/,\s*([}\]])/g, '$1'), t.replace(/[“”]/g, '"').replace(/,\s*([}\]])/g, '$1')];
  /* 문자열 안의 실제 줄바꿈·탭을 JSON이 읽을 수 있게 고침 */
  const fix = x => { let o = '', q = false, e = false; for (const ch of x) { if (q) { if (e) { o += ch; e = false; } else if (ch === '\\') { o += ch; e = true; } else if (ch === '"') { o += ch; q = false; } else if (ch === '\n') o += '\\n'; else if (ch === '\r') o += ''; else if (ch === '\t') o += ' '; else o += ch; } else { if (ch === '"') q = true; o += ch; } } return o; };
  tries.push(fix(tries[1]), fix(tries[2]));
  for (const s of tries) { try { const data = JSON.parse(s); if (isTemplate(data)) return {ok: false, error: '요청문 안의 예시 양식이 그대로 들어왔어요. AI가 써 준 답변이 아니에요. 요청문을 AI에 붙여넣어 받은 답변을 붙여넣어 주세요.'}; return {ok: true, data}; } catch (e) { /* 다음 방법 */ } }
  return {ok: false, error: 'JSON 형식을 읽지 못했어요. 답변이 중간에 끊기지 않았는지 확인하고, 끊겼다면 Claude에 "이어서 JSON을 끝까지 출력해 주세요"라고 요청해 주세요.'};
}
function normalizeAI(j) {
  const R = j.report || {}, G = j.guide || {}, E = ('edu' in j) ? j.edu : (R.edu || null);
  const pairs = (v, a, b) => (Array.isArray(v) ? v : []).map(o => (o && typeof o === 'object') ? {[a]: toStr(o[a]), [b]: toStr(o[b])} : {[a]: '', [b]: toStr(o)}).filter(o => has(o[a]) || has(o[b]));

    edu: (E && typeof E === 'object') ? {title: toStr(E.title), understand: toStr(E.understand), tips: toArr(E.tips), phrases: toArr(E.phrases), together: toArr(E.together)} : null,
    guide: {surveySummary: toStr(G.surveySummary), obsSummary: toStr(G.obsSummary), growthChange: toStr(G.growthChange), common: toArr(G.common), diff: toArr(G.diff), topics: pairs(G.topics, 'title', 'text'), safety: toStr(G.safety), concern: toStr(G.concern), linkage: toStr(G.linkage), scenario: sc},

    ref, className: 'ed ' + cls, contentEditable: true, suppressContentEditableWarning: true, spellCheck: false, 'data-ph': ph,
    onBlur: e => { const t = e.currentTarget.innerText.replace(/\n{3,}/g, '\n\n').trim(); if (t !== (value || '')) onChange(t); },

}

function A4({label, cls = '', tight, onTight, children}) {
  const flow = useRef(), page = useRef(); const [over, setOver] = useState(false);
  useEffect(() => {
    const el = flow.current, pg = page.current; if (!el || !pg) return;
    const chk = () => { const cs = getComputedStyle(pg); const avail = 1123 - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom); setOver(el.offsetHeight > avail + 1); };
    chk(); if (!window.ResizeObserver) return;
    const ro = new ResizeObserver(chk); ro.observe(el); return () => ro.disconnect();
  }, [tight]);
  return html`<div className="pagebox"><div className="pagebar noprint"><b>${label}</b>${over ? html`<span className="chip danger"><${Icon} n="alert" size=${13}/>A4 한 장을 넘어요. 글자를 줄이지 말고 분량을 줄이거나 여백 줄이기를 켜 주세요</span>` : html`<span className="chip ok"><${Icon} n="check" size=${13}/>A4 한 장 안에 들어가요</span>`}
      ${onTight && html`<label className="row small" style=${{gap:'5px',cursor:'pointer'}}><input type="checkbox" checked=${!!tight} onChange=${e => onTight(e.target.checked)} style=${{accentColor:'var(--sage-deep)'}}/>여백 줄이기 (글자 크기는 그대로)</label>`}</div>
    <div ref=${page} className=${'page ' + cls + (tight ? ' tight' : '') + (over ? ' over' : '')}><div className="flow" ref=${flow}>${children}</div></div></div>`;
}
function ReportPhoto({p, h}) {

  return html`<figure className="rphoto"><div className="rframe" style=${{aspectRatio: ratio, height: h + 'px'}}><img src=${p.src} alt=${p.caption || ''} style=${{display:'block',width:'100%',height:'100%',maxWidth:'none',objectFit:p.fit,objectPosition:`${p.x}% ${p.y}%`,transform:`scale(${p.zoom / 100})`,transformOrigin:`${p.x}% ${p.y}%`}}/></div>${has(p.caption) && html`<figcaption>${p.caption}</figcaption>`}</figure>`;
}
function printDoc(mode, say) {

          ${qs.length ? html`<ol className="g-ul" style=${{listStyle:'decimal'}}>${qs.map(q => html`<li key=${q.id}>${q.q} <span className=${'g-tag' + (q.mode ? '' : ' warn')}>${q.mode ? modeShort[q.mode] : '전달 방식 미선택'}</span></li>`)}</ol>` : html`<p className="g-ph">등록된 부모님 질문이 없어요. 상담 시작 때 직접 여쭤봐 주세요.</p>`}</section>

          ${qs.length ? qs.map((q, i) => html`<div key=${q.id} className="g-q"><b>Q${i + 1}. ${q.q}</b> <span className=${'g-tag' + (q.mode ? '' : ' warn')}>${q.mode ? Q_MODES.find(m => m[0] === q.mode)[1] : '전달 방식 미선택'}</span>
            <div className="a">${has(q.a) ? q.a : html`<span className="g-tag red">답변 준비 필요</span>`}</div></div>`) : html`<p className="g-ph">—</p>`}</section>

      <${A4} label="가이드 2페이지 · 요약과 핵심 주제" cls="guide" ...${tp}>

        <section className="gs"><h4><span className="gn">7</span>부모와 교사 관찰의 공통점과 차이점</h4>
          ${G ? html`<div className="g-2"><div className="g-box"><b>공통점</b><${EdList} items=${G.common} onChange=${v => gset('common', v)} add="추가" ph="공통점"/></div><div className="g-box"><b>차이점</b><${EdList} items=${G.diff} onChange=${v => gset('diff', v)} add="추가" ph="차이점"/></div></div>` : html`<p className="g-ph">Claude 결과를 반영하면 표시돼요.</p>`}</section>

          ${safe ? T('safety', ul(rawLines([...SAFETY_Q.map(([k, l]) => [k, l])], k => rec.safety[k])), '안전·건강 상담 내용') : html`<p className="g-ph">입력된 내용이 없어요. (리포트에서도 생략됩니다)</p>`}</section>
